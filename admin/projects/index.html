<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>ARSTINLA Project Manager</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #121311;
      color: #f3f1eb;

      font-family:
        Arial,
        sans-serif;
    }

    .admin {
      width: min(
        calc(100% - 48px),
        1500px
      );

      margin: 0 auto;
      padding: 50px 0 100px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      padding-bottom: 28px;

      border-bottom:
        1px solid rgba(255,255,255,.15);
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 72px);
      font-weight: 300;
    }

    .admin-label {
      color: #c47752;
      font-size: 12px;
      letter-spacing: .18em;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 24px;

      margin: 32px 0 40px;
    }

    .filter {
      padding: 8px 0;
      border: 0;
      background: none;
      color: #777970;

      cursor: pointer;
    }

    .filter.active {
      color: #fff;
    }

    .projects {
      display: grid;
      gap: 24px;
    }

    .project-card {
      border:
        1px solid rgba(255,255,255,.14);

      padding: 24px;
    }

.project-head {
  display: grid;
  grid-template-columns: 160px minmax(0, 1fr) auto;
  gap: 24px;
  align-items: center;
}
  }

  /* ADD PROJECT UI */

  .add-project-button {
    border: 1px solid #c47752;
    background: #c47752;
    color: #fff;
    padding: 13px 18px;
    cursor: pointer;
  }

  .project-dialog {
    border: 1px solid rgba(255,255,255,.15);
    background: #121311;
    color: #fff;
    width: min(620px, calc(100% - 32px));
    padding: 0;
  }

  .project-dialog::backdrop {
    background: rgba(0,0,0,.75);
  }

  .project-dialog-inner {
    padding: 32px;
  }

  .project-dialog-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }

  .project-dialog-head h2 {
    margin: 0;
    font-weight: 400;
  }

  .dialog-close {
    border: 0;
    background: transparent;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
  }

  .admin-form {
    display: grid;
    gap: 20px;
  }

  .admin-field {
    display: grid;
    gap: 8px;
  }

  .admin-field label {
    color: #85867f;
    font-size: 12px;
  }

  .admin-field input,
  .admin-field select {
    width: 100%;
    padding: 13px 12px;
    border: 1px solid rgba(255,255,255,.18);
    background: #191a17;
    color: #fff;
  }

  .admin-form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 10px;
  }

  .project-cover {
  width: 160px !important;
  max-width: 160px !important;
  height: 120px !important;
  aspect-ratio: auto !important;

  object-fit: cover !important;
  display: block;
  flex: 0 0 160px;
}

    .project-number {
      color: #c47752;
      font-size: 12px;
      letter-spacing: .15em;
    }

    .project-title {
      margin: 6px 0;
      font-size: 24px;
    }

    .project-meta {
      color: #85867f;
      font-size: 14px;
    }

    .browse-button {
      border:
        1px solid rgba(255,255,255,.22);

      background: transparent;
      color: #fff;

      padding: 12px 16px;
      cursor: pointer;
    }

    .project-files {
      display: none;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(180px, 1fr)
        );

      gap: 16px;

      margin-top: 24px;
      padding-top: 24px;

      border-top:
        1px solid rgba(255,255,255,.1);
    }

    .project-files.open {
      display: grid;
    }

    .file {
      background: #191a17;
      padding: 10px;
    }

    .file img {
      display: block;

      width: 100%;
      aspect-ratio: 4 / 3;

      object-fit: cover;

      margin-bottom: 10px;
    }

    .file-name {
      font-size: 11px;
      color: #aaa;
      word-break: break-all;
    }

  @media (max-width: 700px) {
  .project-head {
    grid-template-columns: 1fr;
  }

  .project-cover {
    width: 100% !important;
    max-width: none !important;
    height: auto !important;
    aspect-ratio: 4 / 3 !important;
  }
}

      .project-head {
        grid-template-columns: 1fr;
      }

      .project-cover {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="admin">

    <header class="admin-header">
      <div>
        <div class="admin-label">
          ARSTINLA ADMIN
        </div>

        <h1>
          Project Manager
        </h1>
      </div>
      <button
  class="add-project-button"
  id="addProjectButton"
  type="button"
>
  + ADD PROJECT
</button>
    </header>


    <div class="filters">

      <button
        class="filter active"
        data-filter="all"
      >
        ALL
      </button>

      <button
        class="filter"
        data-filter="residential"
      >
        RESIDENTIAL
      </button>

      <button
        class="filter"
        data-filter="commercial"
      >
        COMMERCIAL
      </button>

      <button
        class="filter"
        data-filter="public"
      >
        PUBLIC
      </button>

      <button
        class="filter"
        data-filter="urban"
      >
        URBAN
      </button>

      <button
        class="filter"
        data-filter="interior"
      >
        INTERIOR
      </button>

    </div>


    <section
      class="projects"
      id="projects"
    ></section>
<dialog
  class="project-dialog"
  id="projectDialog"
>
  <div class="project-dialog-inner">

    <div class="project-dialog-head">
      <h2>Add Project</h2>

      <button
        class="dialog-close"
        id="closeProjectDialog"
        type="button"
      >
        ×
      </button>
    </div>

    <form
      class="admin-form"
      id="addProjectForm"
    >

      <div class="admin-field">
        <label for="projectTitle">
          PROJECT TITLE
        </label>

        <input
          id="projectTitle"
          name="title"
          type="text"
          required
        >
      </div>

      <div class="admin-field">
        <label for="projectCategory">
          CATEGORY
        </label>

        <select
          id="projectCategory"
          name="category"
          required
        >
          <option value="residential">
            Residential
          </option>

          <option value="commercial">
            Commercial
          </option>

          <option value="public">
            Public & Institutional
          </option>

          <option value="urban">
            Urban
          </option>

          <option value="interior">
            Interior
          </option>
        </select>
      </div>

      <div class="admin-field">
        <label for="projectLocation">
          LOCATION
        </label>

        <input
          id="projectLocation"
          name="location"
          type="text"
          placeholder="Bangkok, Thailand"
        >
      </div>

      <div class="admin-field">
        <label for="projectSlug">
          SLUG
        </label>

        <input
          id="projectSlug"
          name="slug"
          type="text"
          placeholder="new-project"
          required
        >
      </div>

      <div class="admin-field">
        <label for="projectCover">
          COVER IMAGE
        </label>

        <input
          id="projectCover"
          name="cover"
          type="file"
          accept="image/*"
        >
      </div>

      <div class="admin-form-actions">

        <button
          class="browse-button"
          id="cancelProject"
          type="button"
        >
          Cancel
        </button>

        <button
          class="add-project-button"
          type="submit"
        >
          Create Project
        </button>

      </div>

    </form>

  </div>
</dialog>
  </main>


<script src="/project-data.js?v=20260902-1427"></script>

  <script>
    const projectsContainer =
      document.getElementById(
        "projects"
      );

    const projects =
      Object.values(
        window.ARSTINLA_PROJECTS || {}
      );


    function collectImages(value) {

      const result = [];

      function walk(item) {

        if (
          typeof item === "string" &&
          /^\/assets\/.+\.(jpg|jpeg|png|webp)$/i
            .test(item)
        ) {
          result.push(item);
          return;
        }

        if (Array.isArray(item)) {
          item.forEach(walk);
          return;
        }

        if (
          item &&
          typeof item === "object"
        ) {
          Object.values(item)
            .forEach(walk);
        }

      }

      walk(value);

      return [...new Set(result)];

    }


    function renderProjects(
      filter = "all"
    ) {

      projectsContainer.innerHTML = "";

      projects.forEach(project => {

        const category =
          project.filterCategory ||
          "";

        if (
          filter !== "all" &&
          category !== filter
        ) {
          return;
        }


        const images =
          collectImages(project);


        const article =
          document.createElement(
            "article"
          );

        article.className =
          "project-card";


        article.innerHTML = `
          <div class="project-head">

            <img
              class="project-cover"
              src="${
  (project.thumbnail || project.hero)
    ? `${project.thumbnail || project.hero}?v=${Date.now()}`
    : ""
}"
            >

            <div>

              <div class="project-number">
                PROJECT ${project.number || ""}
              </div>

              <div class="project-title">
                ${project.title || "Untitled"}
              </div>

              <div class="project-meta">
                ${project.category || ""}
                ·
                ${project.location || ""}
              </div>

              <div class="project-meta">
                ${project.assetFolder || ""}
              </div>

            </div>

            <button
              class="browse-button"
              type="button"
            >
              Browse Files
            </button>

          </div>

          <div class="project-files">
<div class="project-upload">
  <input
    class="project-upload-input"
    type="file"
    accept="image/jpeg,image/png,image/webp"
    multiple
  >

  <button
    class="project-upload-button"
    type="button"
  >
    Upload Images
  </button>

  <div class="project-upload-status"></div>
</div>
         
          <div class="project-file-grid">

  ${images.map(path => `
    <div class="file">

      <img
        src="${path}"
        alt=""
        loading="lazy"
      >

      <div class="file-name">
        ${path}
      </div>

    </div>
  `).join("")}

</div>
        `;


        const browseButton =
          article.querySelector(
            ".browse-button"
          );

        const files =
          article.querySelector(
            ".project-files"
          );


browseButton.addEventListener(
  "click",
  async () => {

    const isOpening =
      !files.classList.contains(
        "open"
      );

    files.classList.toggle(
      "open"
    );

    browseButton.textContent =
      files.classList.contains(
        "open"
      )
        ? "Close Files"
        : "Browse Files";


    if (!isOpening) {
      return;
    }


    let adminKey =
      sessionStorage.getItem(
        "ARSTINLA_ADMIN_KEY"
      );

    if (!adminKey) {

      adminKey =
        prompt(
          "Enter ARSTINLA Admin Key"
        );

      if (!adminKey) {
        return;
      }

      sessionStorage.setItem(
        "ARSTINLA_ADMIN_KEY",
        adminKey
      );
    }


    try {

      const response =
        await fetch(
          `/api/project-files?projectNumber=${encodeURIComponent(project.number)}`,
          {
            headers: {
              "x-admin-key":
                adminKey
            }
          }
        );


      const result =
        await response.json();


      if (!response.ok) {
        throw new Error(
          result.error ||
          "Cannot load project files"
        );
      }


      const fileGrid =
        files.querySelector(
          ".project-file-grid"
        );


      if (fileGrid) {

fileGrid.innerHTML =
  result.files
    .map(
      file => `
        <div class="file">

          <img
            src="${file.path}?v=${Date.now()}"
            alt=""
            loading="lazy"
          >

          <div class="file-name">
            ${file.path}
          </div>

          <button
            type="button"
            class="delete-project-file"
            data-path="${file.path}"
          >
            Delete
          </button>

        </div>
      `
    )
    .join("");
      }

    }
    catch (error) {

      alert(
        error.message
      );
    }
  }
);

  const uploadInput =
  article.querySelector(
    ".project-upload-input"
  );

const uploadButton =
  article.querySelector(
    ".project-upload-button"
  );

const uploadStatus =
  article.querySelector(
    ".project-upload-status"
  );



uploadButton.addEventListener(
  "click",
  async () => {

    const selectedFiles =
      Array.from(
        uploadInput.files || []
      );

    if (!selectedFiles.length) {
      alert(
        "กรุณาเลือกรูปก่อน"
      );
      return;
    }


    let adminKey =
      sessionStorage.getItem(
        "ARSTINLA_ADMIN_KEY"
      );

    if (!adminKey) {

      adminKey =
        prompt(
          "Enter ARSTINLA Admin Key"
        );

      if (!adminKey) {
        return;
      }

      sessionStorage.setItem(
        "ARSTINLA_ADMIN_KEY",
        adminKey
      );
    }


    uploadButton.disabled = true;

    uploadStatus.textContent =
      "Uploading...";


    try {

      const formData =
        new FormData();

      formData.append(
        "projectNumber",
        project.number
      );


      selectedFiles.forEach(
        file => {
          formData.append(
            "files",
            file
          );
        }
      );


      const response =
        await fetch(
          "/api/project-files",
          {
            method: "POST",

            headers: {
              "x-admin-key":
                adminKey
            },

            body:
              formData
          }
        );


      const result =
        await response.json();


      if (!response.ok) {

        throw new Error(
          result.error ||
          "Upload failed"
        );
      }


      uploadStatus.textContent =
        `Uploaded ${result.uploaded.length} file(s)`;

      alert(
        `อัปโหลดรูป Project ${project.number} เรียบร้อย`
      );

    }
    catch (error) {

      uploadStatus.textContent =
        "Upload failed";

      alert(
        error.message
      );

    }
    finally {

      uploadButton.disabled =
        false;
    }
  }
);


        projectsContainer.appendChild(
          article
        );

      });

    }


    document
      .querySelectorAll(".filter")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".filter")
              .forEach(item => {
                item.classList.remove(
                  "active"
                );
              });

            button.classList.add(
              "active"
            );

            renderProjects(
              button.dataset.filter
            );

          }
        );

      });
const addProjectButton =
  document.getElementById(
    "addProjectButton"
  );

const projectDialog =
  document.getElementById(
    "projectDialog"
  );

const closeProjectDialog =
  document.getElementById(
    "closeProjectDialog"
  );

const cancelProject =
  document.getElementById(
    "cancelProject"
  );

const addProjectForm =
  document.getElementById(
    "addProjectForm"
  );


addProjectButton.addEventListener(
  "click",
  () => {
    projectDialog.showModal();
  }
);


function closeAddProject() {
  projectDialog.close();
}


closeProjectDialog.addEventListener(
  "click",
  closeAddProject
);

cancelProject.addEventListener(
  "click",
  closeAddProject
);


addProjectForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const submitButton =
      addProjectForm.querySelector(
        'button[type="submit"]'
      );

    let adminKey =
      sessionStorage.getItem(
        "ARSTINLA_ADMIN_KEY"
      );

    if (!adminKey) {
      adminKey = prompt(
        "Enter ARSTINLA Admin Key"
      );

      if (!adminKey) {
        return;
      }

      sessionStorage.setItem(
        "ARSTINLA_ADMIN_KEY",
        adminKey
      );
    }

    submitButton.disabled = true;
    submitButton.textContent =
      "Creating...";

    try {

      const formData =
        new FormData(
          addProjectForm
        );

      const response =
        await fetch(
          "/api/projects",
          {
            method: "POST",

            headers: {
              "x-admin-key":
                adminKey
            },

            body: formData
          }
        );

      const result =
        await response.json();

      if (response.status === 401) {

        sessionStorage.removeItem(
          "ARSTINLA_ADMIN_KEY"
        );

        throw new Error(
          "Admin Key ไม่ถูกต้อง"
        );
      }

      if (!response.ok) {
        throw new Error(
  [
    result.error,
    result.status
      ? `GitHub status: ${result.status}`
      : "",
    result.details || ""
  ]
    .filter(Boolean)
    .join("\n")
);
      }

      alert(
        `สร้าง Project ${result.number} เรียบร้อย`
      );

      addProjectForm.reset();
      projectDialog.close();

      window.location.reload();

    }
    catch (error) {

      alert(
        error.message ||
        "เกิดข้อผิดพลาด"
      );

    }
    finally {

      submitButton.disabled = false;
      submitButton.textContent =
        "Create Project";

    }

  }
);
    renderProjects();
  </script>

</body>
</html>
