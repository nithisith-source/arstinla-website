<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตรวจรับงานงวด — เช็คก่อนสร้าง</title>
<meta name="theme-color" content="#0F6E6A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="../shared/pwa-install.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* สีหลัก — เปลี่ยน 3 ค่าแรกให้ตรงกับ arstinla.com ได้ */
:root{
  --brand:#0F6E6A; --brand-ink:#ffffff; --brand-soft:#DCEDEB;
  --bg:#EDEFEE; --surface:#FFFFFF; --ink:#1E2A2D; --muted:#5F6D70; --line:#CDD3D2;
  --ok:#2F7A3B; --ok-soft:#E0F0E2; --warn:#A86A00; --warn-soft:#FBEFD6; --bad:#B0402C; --bad-soft:#F8E1DC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#4DB6AE; --brand-ink:#0B1F1E; --brand-soft:#173634;
  --bg:#141A1B; --surface:#1D2526; --ink:#E6ECEB; --muted:#9AA8A9; --line:#334042;
  --ok:#7CC487; --ok-soft:#1E3322; --warn:#E3B04B; --warn-soft:#3A2F17; --bad:#EE8A76; --bad-soft:#3E2420;
}}
:root[data-theme="dark"]{
  --brand:#4DB6AE; --brand-ink:#0B1F1E; --brand-soft:#173634;
  --bg:#141A1B; --surface:#1D2526; --ink:#E6ECEB; --muted:#9AA8A9; --line:#334042;
  --ok:#7CC487; --ok-soft:#1E3322; --warn:#E3B04B; --warn-soft:#3A2F17; --bad:#EE8A76; --bad-soft:#3E2420;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",Tahoma,"Leelawadee UI",sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
header{padding:20px 0 8px}
header h1{margin:0;font-size:1.5rem;line-height:1.3;font-weight:700}
header p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding:12px 0;border-bottom:2px solid var(--line);margin-bottom:20px}
.tab{flex:1;font:inherit;font-weight:600;padding:10px 8px;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
section[hidden]{display:none}
h2{font-size:1.15rem;margin:28px 0 8px}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 12px}
label.f{display:block;font-size:.9rem;font-weight:600;margin-bottom:4px}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.names{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding:8px 0}
.names input{font-weight:600;text-align:center;background:var(--brand-soft);border-color:transparent}
.row{padding:10px 0;border-bottom:1px solid var(--line)}
.row-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:500;margin-bottom:6px}
.row-h .del{border:0;background:none;color:var(--muted);font:inherit;font-size:.85rem;cursor:pointer;padding:2px 6px}
.row input{text-align:right;font-variant-numeric:tabular-nums}
.row input.hi{background:var(--bad-soft);border-color:var(--bad)}
.row input.lo{background:var(--warn-soft);border-color:var(--warn)}
.row input.miss{background:var(--warn-soft);border-color:var(--warn);border-style:dashed}
.addrow{display:flex;gap:6px;margin-top:12px}
.addrow input{flex:1}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 14px;background:var(--brand);color:var(--brand-ink);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.totals{margin-top:20px;background:var(--surface);border-radius:10px;padding:14px;border:1px solid var(--line)}
.totals .grid3 div{text-align:center}
.totals .name{font-size:.85rem;color:var(--muted)}
.totals .sum{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.totals .psm{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.85rem;color:var(--muted);margin:8px 0 0}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .l-hi::before{background:var(--bad-soft);border:1px solid var(--bad)}
.legend .l-lo::before{background:var(--warn-soft);border:1px solid var(--warn)}
.legend .l-miss::before{background:var(--warn-soft);border:1px dashed var(--warn)}
.warns{list-style:none;padding:0;margin:0}
.warns li{padding:10px 12px;border-left:4px solid var(--warn);background:var(--surface);margin-bottom:6px;border-radius:0 6px 6px 0;font-size:.95rem}
.warns li.bad{border-left-color:var(--bad)}
.warns li b{font-weight:600}
.empty{color:var(--muted);font-size:.95rem}
/* checklist */
.overall{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;gap:16px;align-items:center}
.overall .big{font-size:2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
details.stage{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:10px}
details.stage summary{list-style:none;cursor:pointer;padding:14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
details.stage summary::-webkit-details-marker{display:none}
.snum{width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:700;display:grid;place-items:center;grid-row:span 2}
.stitle{font-weight:600;line-height:1.35}
.scount{font-size:.85rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.swhen{font-size:.85rem;color:var(--muted);grid-column:2 / 4}
.stage.done .snum{background:var(--ok);color:var(--surface)}
.stage.hasfix .snum{background:var(--bad);color:var(--surface)}
.items{padding:0 14px 8px}
.item{padding:12px 0;border-top:1px solid var(--line)}
.item p{margin:0 0 8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-size:.9rem;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"][data-s="ok"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.seg button[aria-pressed="true"][data-s="fix"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.seg button[aria-pressed="true"][data-s="na"]{background:var(--line);font-weight:600}
.item input.note{margin-top:8px;font-size:.9rem;display:none}
.item.fix input.note,.item input.note.has{display:block}
.fixlist li{border-left-color:var(--bad)}
.foot{margin-top:28px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;align-items:center}

select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.proj{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
@media (max-width:480px){.proj{grid-template-columns:1fr}}
.addph{font-size:.9rem;padding:6px 12px;border-radius:20px;border:1px dashed var(--muted);color:var(--muted);cursor:pointer}
.addph:focus-within{outline:3px solid var(--brand);outline-offset:2px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos:not(:empty){margin-top:10px}
.ph{position:relative}
.ph .th{padding:0;border:0;background:none;cursor:zoom-in;display:block}
.ph img{width:72px;height:72px;object-fit:cover;border-radius:6px;display:block;border:1px solid var(--line)}
.ph .x{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);background:var(--ink);color:var(--surface);font-size:14px;line-height:1;padding:0;cursor:pointer}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:grid;place-items:center;padding:16px}
#lb[hidden]{display:none}
#lb img{max-width:100%;max-height:85vh;border-radius:6px}
#lb .btn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px}
.export{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px}
.chk{display:flex;gap:8px;align-items:center;font-size:.95rem;cursor:pointer}
.chk input{width:18px;height:18px;margin:0}
.btn[disabled]{opacity:.6;cursor:progress}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header style="margin-bottom:16px">
  <h1>ตรวจรับงานงวด</h1>
  <p>ตรวจงานให้ครบทุกข้อก่อนอนุมัติจ่ายเงินแต่ละงวด</p>
</header>
<!-- ============ ตรวจรับงานงวด ============ -->
<section id="p-c">
  <div class="proj">
    <div><label class="f" for="pj-name">โครงการ / บ้านเลขที่</label><input id="pj-name" data-p="name" placeholder="เช่น บ้านคุณสมชาย ซ.รามอินทรา 40"></div>
    <div><label class="f" for="pj-con">ผู้รับเหมา</label><input id="pj-con" data-p="con"></div>
    <div><label class="f" for="pj-ins">ผู้ตรวจ</label><input id="pj-ins" data-p="ins"></div>
    <div><label class="f" for="pj-date">วันที่ตรวจ</label><input id="pj-date" data-p="date" type="date"></div>
  </div>
  <div class="overall">
    <div class="big" id="pct">0%</div>
    <div style="flex:1">
      <div id="ovtxt" style="font-size:.9rem;margin-bottom:6px">ยังไม่ได้ตรวจ</div>
      <div class="bar"><i id="ovbar"></i></div>
    </div>
  </div>

  <div id="stages"></div>

  <h2>รายการที่ต้องให้ผู้รับเหมาแก้</h2>
  <ul class="warns fixlist" id="fixes"></ul>

  <h2>ส่งสรุปให้ผู้รับเหมา</h2>
  <div class="export">
    <div><label class="f" for="exStage">งวดที่จะส่ง</label><select id="exStage"></select></div>
    <label class="chk"><input type="checkbox" id="exFix"> เฉพาะรายการที่ต้องแก้</label>
    <button class="btn" id="exBtn">สร้าง PDF</button>
    <p class="hint" id="exMsg" style="margin:0" aria-live="polite">PDF จะมีผลตรวจ บันทึก รูปถ่าย และช่องลงชื่อ</p>
  </div>

  <div class="foot"><span>ตรวจให้ครบก่อนอนุมัติจ่ายงวดถัดไป · ข้อมูลเก็บไว้ในเครื่องนี้</span><button class="btn ghost" id="resetC">ล้างผลตรวจ</button></div>
</section>
</div>
<div id="lb" hidden role="dialog" aria-label="ดูรูป"><img alt=""><button class="btn">ปิด</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)&&n>0?n:null};
const fmt=n=>n.toLocaleString('th-TH',{maximumFractionDigits:0});
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ---------- ตรวจรับงานงวด ---------- */
const STAGES=[
 {t:'ผังและเตรียมพื้นที่',w:'ก่อนตอกเข็ม',i:['หมุดเขตที่ดินครบ ตรงตามโฉนด','วางผังอาคารได้ระยะร่นตามแบบที่ได้รับอนุญาต','กำหนดระดับ ±0.00 และหมุดอ้างอิงชัดเจน','ตำแหน่งแนวเสาตรงกับแบบ ตรวจด้วยเทปวัดจริง']},
 {t:'เสาเข็มและฐานราก',w:'ก่อนเทฐานราก',i:['จำนวน ชนิด ขนาด และความยาวเสาเข็มตรงตามแบบ','ตำแหน่งเข็มไม่เยื้องศูนย์เกินที่วิศวกรกำหนด','ตัดหัวเข็มที่ระดับถูกต้อง หัวเข็มไม่แตก','รองก้นหลุมด้วยทรายและคอนกรีตหยาบก่อนวางเหล็ก','เหล็กเสริมขนาดและระยะห่างตรงแบบ มีลูกปูนรองระยะหุ้ม','มีผลทดสอบเสาเข็ม (ถ้าแบบกำหนด)']},
 {t:'โครงสร้าง เสา คาน พื้น',w:'ก่อนเทคอนกรีตแต่ละชั้น',i:['เหล็กเสริมขนาด จำนวน ระยะทาบ ตรงตามแบบ','ลูกปูนครบ เหล็กไม่ติดแบบหล่อ','แบบหล่อได้ดิ่ง ค้ำยันแน่น ไม่รั่ว','ใบส่งคอนกรีตระบุกำลังอัดตรงสเปก','เก็บก้อนตัวอย่างคอนกรีตส่งทดสอบ','เทแล้วไม่มีโพรง รูพรุน หรือเหล็กโผล่','บ่มคอนกรีตและถอดแบบตามระยะเวลาที่กำหนด']},
 {t:'หลังคา',w:'ก่อนมุงและหลังมุง',i:['ขนาดโครงเหล็กตรงแบบ รอยเชื่อมเต็ม ทาสีกันสนิม','ระยะแปและความชันตรงตามที่ผู้ผลิตกระเบื้องกำหนด','ติดตั้งฉนวนหรือแผ่นสะท้อนความร้อนตามสเปก','ครอบ เชิงชาย รางน้ำ และปีกนกเรียบร้อย','ฉีดน้ำทดสอบแล้วไม่รั่ว']},
 {t:'ผนัง ก่อ ฉาบ',w:'ก่อนฉาบและหลังฉาบ',i:['ผนังได้ดิ่งและได้แนว','มีเสาเอ็นทับหลังที่มุมผนัง รอบประตู หน้าต่าง','ปูนก่อเต็มแนว ไม่มีช่องว่าง','ติดตาข่ายกรงไก่ตรงรอยต่อผนังกับโครงสร้าง','ฉาบเรียบ ไม่ร้าว ไม่โก่ง และบ่มน้ำ']},
 {t:'ระบบไฟฟ้าและประปา',w:'ก่อนปิดผนังและฝ้า',i:['สายไฟร้อยท่อ ขนาดสายตรงตามแบบ','ตู้ไฟมีเครื่องตัดไฟรั่ว และต่อสายดินจริง','ทดสอบแรงดันท่อน้ำดีแล้วไม่ตก','ท่อระบายน้ำมีความลาดเอียง มีท่ออากาศ','ถังบำบัดติดตั้งถูกตำแหน่งและระดับ']},
 {t:'กันซึมและพื้นห้องน้ำ',w:'ก่อนปูกระเบื้อง',i:['ทาวัสดุกันซึมพื้นและขึ้นผนังตามสเปก','ขังน้ำทดสอบอย่างน้อย 24 ชั่วโมง ไม่ซึม','พื้นลาดเอียงเข้าหาท่อระบาย ไม่มีน้ำขัง']},
 {t:'งานตกแต่งและส่งมอบ',w:'งวดสุดท้าย',i:['กระเบื้องเคาะแล้วไม่กลวง แนวยาแนวเรียบ','ประตูหน้าต่างเปิดปิดสนิท ไม่รั่วเมื่อฝนตก','สีเรียบ ไม่ด่าง ไม่มีคราบ','สุขภัณฑ์ ไฟ ปลั๊ก ใช้งานได้ทุกจุด','ได้รับเอกสารรับประกัน แบบก่อสร้างจริง และกุญแจครบ']}
];
let C=load('ck-check',{});
const saveC=()=>save('ck-check',C);
const P=load('ck-proj',{});
document.querySelectorAll('[data-p]').forEach(el=>{el.value=P[el.dataset.p]||'';el.oninput=()=>{P[el.dataset.p]=el.value;save('ck-proj',P)}});

/* ----- เก็บรูปใน IndexedDB ----- */
let dbp=null;const mem=new Map(),urls=new Map();
function idb(){if(!dbp)dbp=new Promise((res,rej)=>{const r=indexedDB.open('ck-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return dbp}
async function putPhoto(k,b){try{const d=await idb();await new Promise((res,rej)=>{const t=d.transaction('p','readwrite');t.objectStore('p').put(b,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){mem.set(k,b)}}
async function getPhoto(k){if(mem.has(k))return mem.get(k);try{const d=await idb();return await new Promise((res,rej)=>{const r=d.transaction('p').objectStore('p').get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}catch(e){return null}}
async function delPhoto(k){mem.delete(k);if(urls.has(k)){URL.revokeObjectURL(urls.get(k));urls.delete(k)}try{const d=await idb();d.transaction('p','readwrite').objectStore('p').delete(k)}catch(e){}}
async function clearPhotos(){mem.clear();urls.forEach(u=>URL.revokeObjectURL(u));urls.clear();try{const d=await idb();d.transaction('p','readwrite').objectStore('p').clear()}catch(e){}}
async function photoURL(k){if(urls.has(k))return urls.get(k);const b=await getPhoto(k);if(!b)return null;const u=URL.createObjectURL(b);urls.set(k,u);return u}
function compress(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const sc=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('x')),'image/jpeg',0.72)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('x'))};im.src=u})}
const toDataURL=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r(null);fr.readAsDataURL(b)});

async function renderPhotos(id){
  const box=document.querySelector(`.photos[data-ph="${id}"]`);if(!box)return;
  const list=(C[id]&&C[id].p)||[];
  const parts=await Promise.all(list.map(async k=>{const u=await photoURL(k);return u?`<div class="ph"><button class="th" data-k="${k}" aria-label="ดูรูปขยาย"><img src="${u}" alt=""></button><button class="x" data-x="${k}" aria-label="ลบรูป">×</button></div>`:''}));
  box.innerHTML=parts.join('');
  box.querySelectorAll('.th').forEach(b=>b.onclick=()=>{$('#lb img').src=urls.get(b.dataset.k);$('#lb').hidden=false;$('#lb .btn').focus()});
  box.querySelectorAll('.x').forEach(b=>b.onclick=async()=>{if(!confirm('ลบรูปนี้?'))return;C[id].p=C[id].p.filter(k=>k!==b.dataset.x);saveC();await delPhoto(b.dataset.x);renderPhotos(id)});
}
$('#lb').onclick=e=>{if(e.target.tagName!=='IMG')$('#lb').hidden=true};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').hidden=true});

function renderStages(){
  $('#stages').innerHTML=STAGES.map((s,si)=>`<details class="stage" data-s="${si}">
    <summary><span class="snum">${si+1}</span><span class="stitle">${esc(s.t)}</span><span class="scount" data-sc="${si}"></span><span class="swhen">ตรวจ${esc(s.w)}</span></summary>
    <div class="items">${s.i.map((it,ii)=>{const id=si+'-'+ii,st=C[id]||{};return `<div class="item ${st.s==='fix'?'fix':''}" data-id="${id}">
      <p>${esc(it)}</p>
      <div class="seg" role="group" aria-label="ผลตรวจ">${[['ok','ผ่าน'],['fix','ต้องแก้'],['na','ไม่มีงานนี้']].map(([k,l])=>`<button data-s="${k}" aria-pressed="${st.s===k}">${l}</button>`).join('')}
        <label class="addph">แนบรูป<input type="file" accept="image/*" multiple hidden></label></div>
      <input class="note ${st.n?'has':''}" placeholder="บันทึกสิ่งที่ต้องแก้" value="${esc(st.n||'')}">
      <div class="photos" data-ph="${id}"></div>
    </div>`}).join('')}</div></details>`).join('');
  document.querySelectorAll('.item').forEach(el=>{
    const id=el.dataset.id;
    el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
      C[id]=C[id]||{};C[id].s=C[id].s===b.dataset.s?undefined:b.dataset.s;
      el.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.s===C[id].s));
      el.classList.toggle('fix',C[id].s==='fix');
      if(C[id].s==='fix')el.querySelector('.note').focus();
      saveC();summarize();
    });
    el.querySelector('.note').oninput=e=>{C[id]=C[id]||{};C[id].n=e.target.value;e.target.classList.toggle('has',!!e.target.value);saveC();summarize()};
    const fi=el.querySelector('input[type=file]'),lab=el.querySelector('.addph');
    fi.onchange=async()=>{
      const files=[...fi.files];fi.value='';if(!files.length)return;
      lab.firstChild.textContent='กำลังบันทึก…';
      C[id]=C[id]||{};C[id].p=C[id].p||[];
      for(let i=0;i<files.length;i++){try{const b=await compress(files[i]);const k=id+'_'+Date.now()+'_'+i;await putPhoto(k,b);C[id].p.push(k)}catch(e){alert('เปิดรูป '+files[i].name+' ไม่ได้ ลองใช้ไฟล์ JPG หรือ PNG')}}
      saveC();lab.firstChild.textContent='แนบรูป';renderPhotos(id);
    };
    if(C[id]&&C[id].p&&C[id].p.length)renderPhotos(id);
  });
}
function summarize(){
  let all=0,done=0;const fixes=[];
  STAGES.forEach((s,si)=>{
    let d=0,f=0;
    s.i.forEach((it,ii)=>{const st=C[si+'-'+ii];if(st&&st.s){d++;if(st.s==='fix'){f++;fixes.push(`<b>งวด ${si+1}</b> ${esc(it)}${st.n?' — '+esc(st.n):''}`)}}});
    all+=s.i.length;done+=d;
    $(`[data-sc="${si}"]`).textContent=`${d}/${s.i.length}`;
    const el=$(`.stage[data-s="${si}"]`);el.classList.toggle('done',d===s.i.length&&!f);el.classList.toggle('hasfix',f>0);
  });
  const p=Math.round(done/all*100);
  $('#pct').textContent=p+'%';$('#ovbar').style.width=p+'%';
  $('#ovtxt').textContent=done?`ตรวจแล้ว ${done} จาก ${all} รายการ${fixes.length?` · ต้องแก้ ${fixes.length}`:''}`:'ยังไม่ได้ตรวจ — เปิดงวดที่กำลังจะจ่ายเงินแล้วเริ่มตรวจ';
  $('#fixes').innerHTML=fixes.length?fixes.map(f=>`<li class="bad">${f}</li>`).join(''):`<li class="empty" style="border-left-color:var(--line)">ยังไม่มีรายการที่ต้องแก้</li>`;
}

/* ----- สร้าง PDF ----- */
$('#exStage').innerHTML='<option value="all">ทุกงวดที่ตรวจแล้ว</option>'+STAGES.map((s,i)=>`<option value="${i}">งวด ${i+1} ${esc(s.t)}</option>`).join('');
const dlP=(window.claude&&window.claude.use)?window.claude.use('downloads').catch(()=>null):Promise.resolve(null);
const ST={ok:['ผ่าน','#2F7A3B','#E0F0E2'],fix:['ต้องแก้','#B0402C','#F8E1DC'],na:['ไม่มีงานนี้','#5F6D70','#ECEEEE'],'':['ยังไม่ตรวจ','#A86A00','#FBEFD6']};
const thDate=d=>{if(!d)return '-';const t=new Date(d+'T00:00:00');return isNaN(t)?d:t.toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'})};

async function buildReport(sel,onlyFix){
  const stages=sel==='all'?STAGES.map((s,i)=>i):[+sel];
  const cnt={ok:0,fix:0,na:0,'':0};let blocks='';
  for(const si of stages){
    const s=STAGES[si];let items='';
    for(let ii=0;ii<s.i.length;ii++){
      const st=C[si+'-'+ii]||{},k=st.s||'';
      if(onlyFix&&k!=='fix')continue;
      if(sel==='all'&&!k)continue;
      cnt[k]++;
      const [lab,fg,bg]=ST[k];
      let imgs='';
      for(const pk of (st.p||[])){const b=await getPhoto(pk);const u=b&&await toDataURL(b);if(u)imgs+=`<img src="${u}">`}
      items+=`<div class="r-item"><div class="r-row"><span class="st" style="color:${fg};background:${bg}">${lab}</span><span class="tx">${ii+1}. ${esc(s.i[ii])}</span></div>${st.n?`<div class="nt">หมายเหตุ: ${esc(st.n)}</div>`:''}${imgs?`<div class="ims">${imgs}</div>`:''}</div>`;
    }
    if(items)blocks+=`<div class="r-head">งวดที่ ${si+1} ${esc(s.t)}</div>${items}`;
  }
  if(!blocks)return null;
  const scope=sel==='all'?'ทุกงวดที่ตรวจแล้ว':`งวดที่ ${+sel+1} ${STAGES[+sel].t}`;
  const el=document.createElement('div');
  el.innerHTML=`<div class="rpt"><style>
  .rpt{font-family:"IBM Plex Sans Thai",Tahoma,sans-serif;color:#1E2A2D;background:#fff;width:190mm;font-size:10.5pt;line-height:1.55}
  .rpt h1{font-size:17pt;margin:0 0 2px;color:#0F6E6A}.rpt .sub{color:#5F6D70;margin:0 0 12px}
  .rpt table{border-collapse:collapse;width:100%;margin-bottom:10px}.rpt td{padding:4px 8px;border:1px solid #CDD3D2;vertical-align:top}.rpt td:first-child{width:28%;background:#F3F5F4;font-weight:600}
  .rpt .sum{display:flex;gap:6px;margin:8px 0 14px}.rpt .sum span{padding:3px 10px;border-radius:12px;font-weight:600;font-size:9.5pt}
  .rpt .r-head{background:#0F6E6A;color:#fff;font-weight:600;padding:5px 10px;margin-top:12px;border-radius:4px}
  .rpt .r-item{padding:8px 4px;border-bottom:1px solid #E1E5E4}
  .rpt .r-row{display:flex;gap:10px;align-items:flex-start}.rpt .st{flex:0 0 22mm;text-align:center;font-weight:600;font-size:9pt;border-radius:10px;padding:1px 0}
  .rpt .tx{flex:1}.rpt .nt{margin:4px 0 0 25mm;color:#B0402C}
  .rpt .ims{margin:6px 0 0 25mm;display:flex;flex-wrap:wrap;gap:2mm}.rpt .ims img{width:52mm;border-radius:3px;border:1px solid #CDD3D2}
  .rpt .sig{display:flex;gap:16mm;margin-top:18mm}.rpt .sig div{flex:1;text-align:center;color:#5F6D70}.rpt .sig b{display:block;border-top:1px solid #1E2A2D;margin-bottom:4px;padding-top:4px;color:#1E2A2D;font-weight:600}
  .rpt .ft{margin-top:10mm;font-size:8.5pt;color:#9AA8A9;text-align:center}</style>
  <h1>รายงานตรวจรับงานก่อสร้าง</h1><p class="sub">${esc(scope)}${onlyFix?' · เฉพาะรายการที่ต้องแก้':''}</p>
  <table><tr><td>โครงการ</td><td>${esc(P.name||'-')}</td></tr><tr><td>ผู้รับเหมา</td><td>${esc(P.con||'-')}</td></tr><tr><td>ผู้ตรวจ</td><td>${esc(P.ins||'-')}</td></tr><tr><td>วันที่ตรวจ</td><td>${esc(thDate(P.date))}</td></tr></table>
  <div class="sum">${['ok','fix','na',''].filter(k=>cnt[k]).map(k=>`<span style="color:${ST[k][1]};background:${ST[k][2]}">${ST[k][0]} ${cnt[k]}</span>`).join('')}</div>
  ${cnt.fix?`<p style="margin:0 0 6px"><b>ขอให้ผู้รับเหมาแก้ไข ${cnt.fix} รายการ</b> ให้แล้วเสร็จก่อนการตรวจรับและอนุมัติจ่ายเงินงวดถัดไป</p>`:''}
  ${blocks}
  <div class="sig"><div><b>ผู้ตรวจ</b>วันที่ ............................</div><div><b>ผู้รับเหมา</b>วันที่ ............................</div></div>
  <div class="ft">จัดทำด้วยแอปเช็คก่อนสร้าง · arstinla.com</div></div>`;
  return el.firstElementChild;
}

$('#exBtn').onclick=async()=>{
  const btn=$('#exBtn'),msg=$('#exMsg'),sel=$('#exStage').value,onlyFix=$('#exFix').checked;
  if(!window.html2pdf){msg.textContent='โหลดตัวสร้าง PDF ไม่สำเร็จ ตรวจการเชื่อมต่ออินเทอร์เน็ตแล้วเปิดหน้านี้ใหม่';return}
  btn.disabled=true;msg.textContent='กำลังสร้าง PDF…';
  try{
    const el=await buildReport(sel,onlyFix);
    if(!el){msg.textContent=onlyFix?'งวดที่เลือกยังไม่มีรายการที่ต้องแก้':'งวดที่เลือกยังไม่มีผลตรวจ — ตรวจอย่างน้อย 1 ข้อก่อนสร้าง PDF';return}
    const nm=(P.name||'บ้าน').replace(/[\\/:*?"<>|]/g,'').slice(0,40);
    const filename=`ตรวจรับงาน-${nm}-${P.date||new Date().toISOString().slice(0,10)}.pdf`;
    const blob=await html2pdf().set({margin:[10,10,12,10],image:{type:'jpeg',quality:0.85},html2canvas:{scale:2,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy'],avoid:['.r-item','.r-head','.sig']}}).from(el).outputPdf('blob');
    const dl=await dlP;
    if(dl){
      try{await dl.save({filename,data:blob});msg.textContent='บันทึก PDF แล้ว ส่งให้ผู้รับเหมาทางไลน์หรืออีเมลได้เลย'}
      catch(e){msg.textContent=e&&e.code==='declined'?'ยกเลิกการบันทึก PDF':'บันทึก PDF ไม่สำเร็จ ลองอีกครั้ง'}
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);
      msg.textContent='ดาวน์โหลด PDF แล้ว';
    }
  }catch(e){msg.textContent='สร้าง PDF ไม่สำเร็จ ลองลดจำนวนรูปหรือเลือกทีละงวด'}
  finally{btn.disabled=false}
};

$('#resetC').onclick=async()=>{if(!confirm('ล้างผลตรวจและรูปถ่ายทั้งหมด?'))return;C={};saveC();await clearPhotos();renderStages();summarize()};
renderStages();summarize();
})();
</script>
<script src="../shared/pwa-install.js"></script>
</body>
