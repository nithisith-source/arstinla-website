<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ใจรู้ — เข้าใจตัวเอง 30 วัน · ARSTINLA</title>
<meta name="description" content="ใจรู้ แบบฝึกเข้าใจตัวเองวันละบท 30 วัน โดย ARSTINLA">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=Noto+Serif+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#E9ECF0">
<style>
:root{--mist:#E9ECF0;--paper:#F4F6F8;--ink:#1C2333;--soft:#5B6B8C;--mute:#7A8499;--line:#D3D8E0;--moon:#C9A24A;--moon-soft:#EFE3C2;--moon-dim:#D6CCAE;--shade:#C9CFDA;--warn:#A4572F;
 --serif:"Noto Serif Thai",Georgia,serif;--sans:"IBM Plex Sans Thai Looped","IBM Plex Sans Thai",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mist:#121827;--paper:#1A2133;--ink:#E6E9F0;--soft:#9AA8C6;--mute:#8590A8;--line:#2A3349;--moon:#E2C072;--moon-soft:#3A3426;--moon-dim:#4A4230;--shade:#2C3550;--warn:#E09367}}
:root[data-theme="dark"]{--mist:#121827;--paper:#1A2133;--ink:#E6E9F0;--soft:#9AA8C6;--mute:#8590A8;--line:#2A3349;--moon:#E2C072;--moon-soft:#3A3426;--moon-dim:#4A4230;--shade:#2C3550;--warn:#E09367}
*{box-sizing:border-box}
html{background:var(--mist)}
body{margin:0;background:var(--mist);color:var(--ink);font:400 16px/1.75 var(--sans);-webkit-font-smoothing:antialiased}
#app{max-width:620px;margin:0 auto;padding:20px 20px 120px}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--moon);outline-offset:3px}
.sub{color:var(--mute);font-size:14px;margin:0}
.brand{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute)}
.brand a{text-decoration:none}
.link{background:none;border:0;padding:6px 0;cursor:pointer;color:var(--soft);font-size:14px}
.link:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:0;border-radius:999px;padding:0 26px;background:var(--ink);color:var(--mist);font:500 15px var(--sans);cursor:pointer;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--soft);background:transparent}
.btn.moon{background:var(--moon);color:#1C2333}
/* hero: the 30-moon cycle */
.hero{text-align:center;margin:18px 0 8px}
.ring{width:min(320px,86vw);aspect-ratio:1;margin:0 auto;display:block}
.ring .m-dark{fill:var(--shade)}
.ring .m-lit{fill:var(--paper);stroke:var(--line);stroke-width:.6}
.ring .done .m-dark{fill:var(--shade);stroke:var(--moon);stroke-width:1}
.ring .done .m-lit{fill:var(--moon);stroke:none}
.ring .now .halo{fill:none;stroke:var(--moon);stroke-width:1.2}
.ring .locked{opacity:.45}
.ring-num{font:500 64px/1 var(--serif);fill:var(--ink)}
.ring-cap{font:400 13px var(--sans);fill:var(--mute)}
.title{font:500 40px/1.15 var(--serif);margin:6px 0 0;letter-spacing:-.01em}
.tagline{font:400 15px/1.6 var(--sans);color:var(--soft);margin:4px 0 0}
/* today */
.today{margin:34px 0 10px;padding:24px 0 26px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.today .kicker{font-size:14px;color:var(--soft);margin:0 0 4px}
.today h2{font:500 28px/1.3 var(--serif);margin:0 0 6px}
.today .row{margin-top:18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
/* modules */
.mods{margin-top:26px}
.mod{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.mod h3{margin:0;font:500 16px/1.4 var(--serif);display:flex;align-items:center;gap:10px}
.mod h3 i{width:3px;height:18px;border-radius:2px;background:var(--c);flex:none}
.mod h3 small{font:400 12px var(--sans);color:var(--mute);margin-left:auto}
.days{display:flex;gap:6px}
.day{width:40px;height:44px;padding:0;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:10px}
.day svg{width:22px;height:22px}
.day .m-dark{fill:var(--shade)}.day .m-lit{fill:var(--paper);stroke:var(--line);stroke-width:1}
.day.done .m-dark{fill:var(--shade);stroke:var(--moon);stroke-width:1.4}.day.done .m-lit{fill:var(--moon);stroke:none}
.day span{font-size:11px;color:var(--mute);line-height:1}
.day.now{background:var(--paper);box-shadow:inset 0 0 0 1px var(--moon)}
.day.now span{color:var(--ink);font-weight:600}
.day:hover:not(:disabled){background:var(--paper)}
.day:disabled{cursor:default;opacity:.5}
.day .tag{font-size:9px;color:var(--moon);font-weight:600}
@media (max-width:520px){.mod{grid-template-columns:1fr}.days{justify-content:space-between}.day{width:auto;flex:1}}
/* pro */
.probox{margin:0;padding:0}
.probox h2{font:500 24px/1.35 var(--serif);margin:0 0 6px}
.probox .price{font:500 18px var(--serif);margin:14px 0 18px}
.probox .price span{color:var(--mute);font:400 14px var(--sans);margin:0 6px}
/* lesson page */
.lesson-head{margin:18px 0 0;padding-left:16px;border-left:3px solid var(--c)}
.lesson-head .kicker{font-size:14px;color:var(--soft);margin:0}
.lesson-head h2{font:500 32px/1.3 var(--serif);margin:2px 0 0}
.lesson{font:400 19px/1.95 var(--serif);margin:26px 0 8px;color:var(--ink)}
.block{margin-top:34px}
label.q{display:flex;gap:12px;font:500 16px/1.6 var(--sans);margin:0 0 10px}
label.q b{font:500 15px var(--serif);color:var(--moon);min-width:1.2em}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font:400 16px/1.8 var(--sans);background:var(--paper);color:var(--ink);resize:vertical}
textarea:focus{outline:0;border-color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 15px;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--mist)}
.sc{display:grid;grid-template-columns:120px 1fr 26px;gap:12px;align-items:center;margin:10px 0;font-size:14px}
.sc input{width:100%;accent-color:var(--moon)}.sc b{text-align:right;font:500 15px var(--serif)}
.prev{font-size:12px;color:var(--mute)}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.mood{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;display:flex;gap:6px;align-items:center}
.mood.on{border-color:var(--moon);background:var(--moon-soft)}
.finish{position:sticky;bottom:0;margin:40px -20px 0;padding:14px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--mist) 30%);display:flex;gap:14px;align-items:center}
.saved{font-size:13px;color:var(--mute)}
#msg{font-size:14px;color:var(--warn)}
.note{font-size:13px;color:var(--warn);margin-top:22px}
/* summary */
.sum-title{font:500 32px/1.3 var(--serif);margin:16px 0 4px}
.sum{margin:26px 0 0}
.sum dt{font:500 14px var(--sans);color:var(--soft);margin-top:22px}
.sum dd{margin:4px 0 0;font:400 18px/1.8 var(--serif);white-space:pre-wrap}
.gate{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
/* ดวงจิต */
.pet-body{transform-box:fill-box;transform-origin:50% 100%}
.eyes{transform-box:fill-box;transform-origin:50% 50%}
.pet-panel{margin:-4px auto 0;max-width:420px}
.pet-stage{font:500 17px var(--serif);margin:0 0 2px;color:var(--ink)}
.count{font-size:13px;color:var(--mute);margin:10px 0 0}
.pet-name{display:flex;gap:8px;justify-content:center;margin-top:12px}
.pet-name input{flex:1;max-width:220px;min-height:44px;border:1px solid var(--line);border-radius:999px;padding:0 16px;font:inherit;background:var(--paper);color:var(--ink)}
.pet-name .btn{min-height:44px;padding:0 18px}
.pet-mini{float:right;width:76px;height:76px;margin:-6px -4px 0 10px}
.reveal{text-align:left}
.reveal-art{display:block;width:min(300px,78vw);margin:10px auto 6px;background:radial-gradient(circle at 50% 52%,hsl(var(--pet-h) 45% 88% / .9),transparent 66%)}
.reveal-name{font:500 40px/1.2 var(--serif);margin:4px 0 0}
.reveal-name span{display:block;font-size:22px;color:var(--soft)}
.reveal .kicker{font-size:14px;color:var(--soft);margin:0}
.r-h{font:500 18px var(--serif);margin:0 0 8px}
.r-list{margin:0;padding-left:1.2em}.r-list li{margin:4px 0}
blockquote{margin:4px 0 14px;padding:4px 0 4px 14px;border-left:3px solid var(--moon);font:400 17px/1.8 var(--serif)}
@media (prefers-reduced-motion:no-preference){
 .ring .pet-body,.pet-mini .pet-body{animation:bob 4.5s ease-in-out infinite}
 @keyframes bob{50%{transform:translateY(-4px)}}
 .eyes{animation:blink 6s infinite}
 @keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
 .pet-mini.fed .pet-body{animation:hop .6s ease}
 @keyframes hop{30%{transform:translateY(-14px) scale(1.06)}60%{transform:translateY(0) scale(.97)}}
 .grow .pet-body{animation:grow 1.4s ease}
 @keyframes grow{0%{transform:scale(.8)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
 .reveal-art{animation:emerge 1.6s ease both}
 @keyframes emerge{0%{opacity:0;transform:scale(.6) rotate(-6deg);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}
}
@media (max-width:380px){.sc{grid-template-columns:92px 1fr 22px}.title{font-size:34px}}
@media (prefers-reduced-motion:no-preference){.ring .now .halo{animation:breathe 4s ease-in-out infinite}@keyframes breathe{50%{stroke-opacity:.25}}}
</style>
</head>

<script>
/* ===== ตั้งค่า ===== */
const APP_ID = 'jairu';
const FREE_DAYS = 7;                       // สมาชิกฟรีทำได้ถึงวันที่ 7
const PRO_URL = '/member/?need=pro';       // หน้าอัปเกรด ARSTINLA Pro
const LOGIN_URL = '/member/';              // หน้าเข้าสู่ระบบด้วย LINE
const params = new URLSearchParams(location.search);
const DEV = params.get('dev') === '1' && /^(localhost|127\.0\.0\.1)$/.test(location.hostname); // ?dev=1 ใช้ได้เฉพาะตอนทดสอบในเครื่อง

/* ===== จุดเชื่อมระบบสมาชิก =====
   ถ้าเว็บมี window.ARSTINLA.getMember() ให้คืนค่า {id, name, loggedIn, isPro}
   ถ้ายังไม่มี จะทำงานในโหมดทดลอง (?pro=1 เพื่อจำลองสมาชิก Pro) */
async function getMember(){
  try{ if(window.ARSTINLA && typeof ARSTINLA.getMember==='function') return await ARSTINLA.getMember(); }catch(e){}
  return {id:'demo', name:'', loggedIn:true, isPro: params.get('pro')==='1', demo:true};
}

/* ===== เนื้อหา ===== */
const MODULES = [
  {n:'รู้จักตัวเองตอนนี้', c:'#7a9e7e'},
  {n:'อารมณ์และปฏิกิริยา', c:'#d08c60'},
  {n:'รูปแบบความคิด', c:'#6c8ebf'},
  {n:'ความสัมพันธ์', c:'#c0738f'},
  {n:'เป้าหมายที่ตรงกับตัวจริง', c:'#b59a3c'},
  {n:'นิสัยและการลงมือทำ', c:'#5f9ea0'}
];
const LIFE = ['สุขภาพกาย','สุขภาพใจ','งาน/อาชีพ','การเงิน','ครอบครัว','เพื่อน/ความสัมพันธ์','การเรียนรู้','ความสนุก/พักผ่อน'];
const T = (id,p)=>({id,type:'text',p});
const DAYS = [
 {t:'จุดเริ่มต้น', l:'การเข้าใจตัวเองเริ่มจากการมองตัวเองตามจริง ไม่ตัดสิน ไม่ต้องตอบให้สวย ตอบให้จริงก็พอ',
  q:[T('a','ถ้าให้อธิบายชีวิตตอนนี้ด้วย 3 คำ จะเป็นคำว่าอะไร'),T('b','อะไรทำให้คุณอยากเข้าใจตัวเองมากขึ้นในช่วงนี้'),T('c','อีก 30 วัน อยากเห็นอะไรในตัวเองเปลี่ยนไป')]},
 {t:'วงล้อชีวิต', l:'ให้คะแนนความพอใจแต่ละด้านของชีวิต 1–10 ตามความรู้สึกวันนี้ เราจะกลับมาเทียบกันอีกครั้งในวันที่ 29',
  q:[{id:'w',type:'scale',p:'ความพอใจในแต่ละด้าน',items:LIFE},T('a','ด้านไหนที่คะแนนต่ำแล้วรู้สึกว่าอยากดูแลก่อน เพราะอะไร')]},
 {t:'คุณค่าที่ยึดถือ', l:'คุณค่า (values) คือสิ่งที่สำคัญกับเราจริงๆ เวลาชีวิตสวนทางกับคุณค่า เรามักรู้สึกอึดอัดโดยไม่รู้สาเหตุ',
  q:[{id:'v',type:'chips',p:'เลือกคุณค่าที่สำคัญที่สุดกับคุณ (ไม่เกิน 5)',max:5,opts:['ความซื่อสัตย์','ครอบครัว','อิสรภาพ','ความมั่นคง','ความคิดสร้างสรรค์','การเติบโต','ความยุติธรรม','สุขภาพ','การยอมรับ','ความสงบ','การช่วยเหลือผู้อื่น','ความสำเร็จ','ความสนุก','ความรู้','ศรัทธา','มิตรภาพ','ความงาม','ความรับผิดชอบ']},
    T('a','เล่าเหตุการณ์หนึ่งที่คุณภูมิใจในตัวเองมาก มันสะท้อนคุณค่าข้อไหน')]},
 {t:'จุดแข็งที่มองข้าม', l:'จุดแข็งมักเป็นสิ่งที่เราทำได้ง่ายจนคิดว่าใครๆ ก็ทำได้ ลองมองผ่านสายตาคนอื่น',
  q:[T('a','คนรอบตัวมักขอให้คุณช่วยเรื่องอะไร'),T('b','งานหรือกิจกรรมอะไรที่ทำแล้วลืมเวลา'),T('c','คำชมที่คุณได้ยินบ่อยที่สุดคืออะไร')]},
 {t:'อะไรเติม อะไรดูดพลัง', l:'สังเกตพลังงานของตัวเองตลอดสัปดาห์ บางอย่างดูเล็กแต่ดูดพลังเราทุกวัน',
  q:[T('a','สิ่งที่เติมพลังให้คุณ (คน สถานที่ กิจกรรม)'),T('b','สิ่งที่ดูดพลังคุณ'),T('c','สัปดาห์นี้จะเพิ่มสิ่งที่เติมพลัง 1 อย่าง คือ')]},
 {t:'ตั้งชื่ออารมณ์', l:'แค่ตั้งชื่ออารมณ์ได้ชัด อารมณ์ก็เบาลงแล้ว เพราะสมองเปลี่ยนจากโหมดตอบโต้มาเป็นโหมดสังเกต',
  q:[{id:'e',type:'chips',p:'วันนี้คุณรู้สึกอะไรบ้าง',max:8,opts:['สงบ','ดีใจ','ขอบคุณ','ตื่นเต้น','เหนื่อย','เบื่อ','กังวล','กลัว','หงุดหงิด','โกรธ','เสียใจ','เหงา','อาย','ผิดหวัง','สับสน','ภูมิใจ']},
    T('a','อารมณ์ไหนแรงที่สุดวันนี้ เกิดขึ้นตอนไหน')]},
 {t:'ตัวกระตุ้น', l:'ตัวกระตุ้น (trigger) คือสถานการณ์ที่ทำให้อารมณ์พุ่งเร็วกว่าปกติ รู้ตัวกระตุ้นก่อน = มีเวลาเลือกมากขึ้น',
  q:[T('a','นึกถึงครั้งล่าสุดที่อารมณ์ขึ้นเร็ว เกิดอะไรขึ้น'),T('b','ตอนนั้นร่างกายรู้สึกอย่างไร (ร้อนหน้า ใจเต้น กำมือ ฯลฯ)'),T('c','คุณทำอะไรต่อ และรู้สึกอย่างไรกับสิ่งที่ทำ')]},
 /* บทที่ 8–30: เนื้อหาเต็มโหลดจากเซิร์ฟเวอร์เฉพาะสมาชิก Pro (/api/jairu/content) */
 {t:'อารมณ์ใต้ภูเขาน้ำแข็ง', pro:true, l:'', q:[]},
 {t:'แบบแผนการตอบสนอง', pro:true, l:'', q:[]},
 {t:'หยุด หายใจ เลือก', pro:true, l:'', q:[]},
 {t:'เสียงในหัว', pro:true, l:'', q:[]},
 {t:'ความคิดไม่ใช่ข้อเท็จจริง', pro:true, l:'', q:[]},
 {t:'ความเชื่อที่จำกัดตัวเอง', pro:true, l:'', q:[]},
 {t:'กับดักความคิด', pro:true, l:'', q:[]},
 {t:'พูดกับตัวเองเหมือนเพื่อน', pro:true, l:'', q:[]},
 {t:'คนรอบตัว', pro:true, l:'', q:[]},
 {t:'บทบาทที่สวม', pro:true, l:'', q:[]},
 {t:'ขอบเขต', pro:true, l:'', q:[]},
 {t:'การเติมใจ', pro:true, l:'', q:[]},
 {t:'ความขัดแย้ง', pro:true, l:'', q:[]},
 {t:'อยากจริง vs ควรอยาก', pro:true, l:'', q:[]},
 {t:'วันธรรมดาในอีก 3 ปี', pro:true, l:'', q:[]},
 {t:'ความกลัวที่ขวางอยู่', pro:true, l:'', q:[]},
 {t:'เป้าหมายเดียว', pro:true, l:'', q:[]},
 {t:'ตัดออก', pro:true, l:'', q:[]},
 {t:'นิสัยจิ๋ว', pro:true, l:'', q:[]},
 {t:'จัดสภาพแวดล้อม', pro:true, l:'', q:[]},
 {t:'เมื่อพลาด', pro:true, l:'', q:[]},
 {t:'ทบทวน', pro:true, l:'', q:[]},
 {t:'จดหมายถึงตัวเองในอนาคต', pro:true, l:'', q:[]}
];
DAYS.forEach((d,i)=>d.m=Math.floor(i/5));

const SUMMARY = [
  ['ชีวิตตอนนี้ใน 3 คำ',1,'a'],['คุณค่าที่ยึดถือ',3,'v'],['จุดแข็ง',4,'b'],['สิ่งที่เติมพลัง',5,'a'],
  ['ตัวกระตุ้นอารมณ์',7,'a'],['ความต้องการใต้อารมณ์',8,'b'],['รูปแบบการตอบสนอง',9,'r'],
  ['เสียงในหัว',11,'a'],['ความเชื่อที่จำกัด',13,'a'],['กับดักความคิด',14,'k'],
  ['การเติมใจที่ชอบ',19,'g'],['เป้าหมายเดียว',24,'a'],['นิสัยจิ๋ว',26,'a'],['สิ่งที่ค้นพบ',29,'a']
];
const MOODS = ['หนักใจ','ไม่ค่อยดี','เฉยๆ','ดี','เบาสบาย'];

/* ===== สถานะ ===== */
let member, S, view = {name:'home'};
const today = ()=>new Date().toLocaleDateString('sv');
const key = ()=>`${APP_ID}:${member.id}`;
function load(){ try{ return JSON.parse(localStorage.getItem(key())) || null }catch(e){ return null } }
function save(){ try{ localStorage.setItem(key(), JSON.stringify(S)) }catch(e){} }
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const doneCount = ()=>Object.keys(S.done).length;
const needsPro = n=> n>FREE_DAYS && ((!member.isPro && !DEV) || DAYS[n-1].pro);
function nextDay(){ for(let n=1;n<=30;n++) if(!S.done[n]) return n; return 0; }
function unlocked(n){
  if(DEV || n===1 || S.done[n]) return true;
  return !!S.done[n-1] && S.done[n-1] !== today();   // เปิดวันละบท
}

/* ===== หน้าหลัก ===== */
function moonPath(phase,r){ // phase 0..1 (0 new, .5 full)
  const k=Math.abs(Math.cos(phase*2*Math.PI))*r, wax=phase<.5;
  const outer=wax?1:0, inner=(phase<.25||phase>.75)?(wax?0:1):(wax?1:0);
  return `M0 ${-r}A${r} ${r} 0 0 ${outer} 0 ${r}A${k.toFixed(2)} ${r} 0 0 ${inner} 0 ${-r}Z`;
}
const phaseOf=n=>(n-.5)/30;
function moonSvg(n,r){ return `<circle class="m-dark" r="${r}"/><path class="m-lit" d="${moonPath(phaseOf(n),r)}"/>`; }
function ring(nd){
  const c=150,R=124,parts=DAYS.map((d,i)=>{const n=i+1,a=(i/30)*2*Math.PI-Math.PI/2,x=c+R*Math.cos(a),y=c+R*Math.sin(a);
    const cls=[S.done[n]?'done':'',n===nd?'now':'',(!S.done[n]&&(needsPro(n)))?'locked':''].join(' ');
    return `<g class="${cls}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">${n===nd?'<circle class="halo" r="13"/>':''}${moonSvg(n,8)}</g>`}).join('');
  const c2=doneCount();
  return `<svg class="ring" viewBox="0 0 300 300" role="img" aria-label="ดวงจิตของคุณ ทำแล้ว ${c2} จาก 30 บท">${parts}
    <g class="${S.grew?'grow':''}" transform="translate(150 146) scale(.84)">${petSvg()}</g></svg>`;
}
function home(){
  const nd = nextDay();
  let todayCard;
  if(!nd) todayCard = `<h2>ครบ 30 วันแล้ว</h2><p class="sub">ดวงจันทร์ครบรอบ และดวงจิตของคุณกลายร่างแล้ว กลับมาอ่านคำตอบของตัวเองได้เสมอ</p><div class="row"><button class="btn moon" onclick="go('reveal')">ดูตัวตนของฉัน</button><button class="btn ghost" onclick="go('summary')">ภาพรวมตัวฉัน</button></div>`;
  else if(!unlocked(nd)) todayCard = `<p class="kicker">วันนี้ทำแล้ว</p><h2>บทที่ ${nd} จะเปิดพรุ่งนี้</h2><p class="sub">เว้นให้ความคิดได้ตกตะกอนสักคืน เป็นส่วนหนึ่งของการฝึก</p>`;
  else if(needsPro(nd)) todayCard = proBox(nd);
  else todayCard = `<p class="kicker">วันที่ ${nd} ใน${esc(MODULES[DAYS[nd-1].m].n)}</p><h2>${esc(DAYS[nd-1].t)}</h2><p class="sub">ใช้เวลาราว 10 นาที</p><div class="row"><button class="btn" onclick="go('day',${nd})">เริ่มบทวันนี้</button></div>`;
  const mods = MODULES.map((m,mi)=>{
    const ns=[1,2,3,4,5].map(k=>mi*5+k), doneIn=ns.filter(n=>S.done[n]).length;
    const cells = ns.map(n=>{
      const lock = !unlocked(n) || needsPro(n);
      const cls = ['day', S.done[n]?'done':'', n===nd&&!lock?'now':''].join(' ');
      const label = `วันที่ ${n} ${DAYS[n-1].t}${S.done[n]?' ทำแล้ว':lock?(needsPro(n)?' สำหรับ Pro':' ยังไม่เปิด'):''}`;
      return `<button class="${cls}" ${lock?'disabled':''} aria-label="${esc(label)}" title="${esc(DAYS[n-1].t)}" onclick="go('day',${n})"><svg viewBox="-11 -11 22 22" aria-hidden="true">${moonSvg(n,9)}</svg><span>${n>FREE_DAYS&&!member.isPro&&!S.done[n]?'<em class="tag">Pro</em>':n}</span></button>`;
    }).join('');
    return `<div class="mod" style="--c:${m.c}"><h3><i></i>${esc(m.n)}<small>${doneIn}/5</small></h3><div class="days">${cells}</div></div>`;
  }).join('');
  return `<div class="brand"><a href="/">ARSTINLA</a><button class="link" onclick="go('summary')">ภาพรวมตัวฉัน</button></div>
    <header class="hero"><h1 class="title">ใจรู้</h1><p class="tagline">เข้าใจตัวเองวันละบท ครบรอบในหนึ่งเดือน${member.name?` · สวัสดี ${esc(member.name)}`:''}</p>${ring(nd)}${petPanel()}<p class="count">ทำแล้ว ${doneCount()} จาก 30 บท</p></header>
    <section class="today">${todayCard}</section>
    <section class="mods" aria-label="บทเรียนทั้ง 30 วัน">${mods}</section>
    ${member.contentError?`<p class="note">โหลดบทเรียนสำหรับ Pro ไม่สำเร็จ รีเฟรชหน้านี้อีกครั้ง หรือตรวจการเชื่อมต่ออินเทอร์เน็ต</p>`:''}
    ${member.demo?`<p class="note">โหมดทดลอง ยังไม่ได้เชื่อมระบบสมาชิก ข้อมูลเก็บในเครื่องนี้เท่านั้น${DEV?' (เปิดทุกบท)':''}</p>`:''}`;
}
function proBox(n,heading){
  return `<div class="probox"><p class="kicker">ทำครบ ${FREE_DAYS} วันแรกแล้ว</p><h2>${heading||`บทที่ ${n}–30 สำหรับสมาชิก ARSTINLA Pro`}</h2>
  <p class="sub">ดวงจิตของคุณกำลังโต ทำต่ออีก 23 บทเพื่อดูว่าในวันที่ 30 มันจะกลายร่างเป็นสัตว์ตัวไหน ซึ่งจะคำนวณจากคำตอบของคุณเอง พร้อมภาพรวมตัวฉันและดาวน์โหลดบันทึกทั้งหมด</p>
  <p class="price">99 บาท<span>ต่อเดือน หรือ</span>990 บาท<span>ต่อปี</span></p>
  <a class="btn moon" href="${PRO_URL}&next=${encodeURIComponent(location.pathname)}">สมัคร Pro</a></div>`;
}

/* ===== หน้าบทเรียน ===== */
function dayView(n){
  const d = DAYS[n-1], a = S.ans[n] || {}, m = MODULES[d.m];
  let qi=0;
  const qs = d.q.map(q=>{
    const v = a[q.id], num=`<b>${++qi}</b>`;
    if(q.type==='text') return `<div class="block"><label class="q" for="q-${q.id}">${num}<span>${esc(q.p)}</span></label><textarea id="q-${q.id}" data-q="${q.id}" oninput="setA(${n},'${q.id}',this.value)">${esc(v)}</textarea></div>`;
    if(q.type==='chips') return `<div class="block"><label class="q">${num}<span>${esc(q.p)}</span></label><div class="chips">${q.opts.map(o=>`<button class="chip ${(v||[]).includes(o)?'on':''}" aria-pressed="${(v||[]).includes(o)}" onclick="chip(${n},'${q.id}',${q.max},this)">${esc(o)}</button>`).join('')}</div></div>`;
    if(q.type==='scale'){
      const prev = q.compare ? (S.ans[q.compare]||{})[q.id] : null;
      return `<div class="block"><label class="q">${num}<span>${esc(q.p)}</span></label>${q.items.map((it,i)=>{const val=(v||[])[i]??5;return `<div class="sc"><span>${esc(it)}${prev?`<br><span class="prev">วันที่ ${q.compare} ได้ ${prev[i]??'-'}</span>`:''}</span><input type="range" min="1" max="10" value="${val}" aria-label="${esc(it)}" oninput="sc(${n},'${q.id}',${i},this)"><b>${val}</b></div>`}).join('')}</div>`;
    }
  }).join('');
  return `<button class="link" onclick="go('home')">← กลับหน้าหลัก</button>
  <header class="lesson-head" style="--c:${m.c}"><svg class="pet-mini" viewBox="-100 -100 200 200" aria-hidden="true">${petSvg()}</svg><p class="kicker">วันที่ ${n} ใน${esc(m.n)}</p><h2>${esc(d.t)}</h2></header>
  <p class="lesson">${esc(d.l)}</p>
  <div class="block"><label class="q"><span>ก่อนเริ่ม วันนี้ใจคุณเป็นอย่างไร</span></label><div class="moods">${MOODS.map((e,i)=>`<button class="mood ${S.mood[n]===i?'on':''}" aria-pressed="${S.mood[n]===i}" onclick="mood(${n},${i})">${e}</button>`).join('')}</div></div>
  ${qs}
  <div class="finish"><button class="btn" id="fin" onclick="finish(${n})">${S.done[n]?'บันทึกการแก้ไข':'จบบทวันนี้'}</button><span class="saved" id="saved">ทุกคำตอบคืออาหารของดวงจิต บันทึกในเครื่องนี้อัตโนมัติ</span><span id="msg" role="status"></span></div>`;
}
function setA(n,id,v){ const o=String((S.ans[n]||{})[id]||''); (S.ans[n] ||= {})[id] = v; save(); if((!o.trim()&&v.trim()) || Math.floor(v.length/60)>Math.floor(o.length/60)) petPing(); }
function chip(n,id,max,el){
  const arr = ((S.ans[n] ||= {})[id] ||= []), o = el.textContent, i = arr.indexOf(o);
  if(i>=0) arr.splice(i,1); else { if(arr.length>=max){ msg(`เลือกได้ไม่เกิน ${max}`); return; } arr.push(o); }
  el.classList.toggle('on'); el.setAttribute('aria-pressed',el.classList.contains('on')); save(); petPing();
}
function sc(n,id,i,el){ const a=((S.ans[n] ||= {})[id] ||= []); a[i]=+el.value; el.nextElementSibling.textContent=el.value; save(); }
function mood(n,i){ S.mood[n]=i; save(); petPing(); document.querySelectorAll('.mood').forEach((b,j)=>{b.classList.toggle('on',j===i);b.setAttribute('aria-pressed',j===i)}); }
function msg(t){ const m=document.getElementById('msg'); if(m) m.textContent=t; }
function finish(n){
  const a = S.ans[n] || {}, d = DAYS[n-1];
  d.q.forEach(q=>{ if(q.type==='scale' && !a[q.id]) (S.ans[n] ||= {})[q.id] = q.items.map(()=>5); });
  const empty = d.q.filter(q=>q.type!=='scale').some(q=>{ const v=(S.ans[n]||{})[q.id]; return !v || (Array.isArray(v)?!v.length:!String(v).trim()); });
  if(empty){ msg('ยังมีคำถามที่ว่างอยู่ ตอบสั้นๆ ก็ได้'); return; }
  const fresh = !S.done[n];
  if(fresh) S.done[n] = today();
  if(fresh) S.grew = n;
  save(); go(fresh && n===30 ? 'reveal' : 'home'); window.scrollTo(0,0);
}

/* ===== ภาพรวมตัวฉัน (Pro) ===== */
function summary(){
  if(!member.isPro && !DEV) return `<button class="link" onclick="go('home')">← กลับหน้าหลัก</button><section class="today">${proBox(FREE_DAYS+1,'ภาพรวมตัวฉัน สำหรับสมาชิก ARSTINLA Pro')}</section>`;
  const rows = SUMMARY.map(([label,n,id])=>{ const v=(S.ans[n]||{})[id]; if(!v||(Array.isArray(v)&&!v.length)) return ''; return `<dt>${esc(label)}</dt><dd>${esc(Array.isArray(v)?v.join(', '):v)}</dd>`; }).join('');
  return `<button class="link" onclick="go('home')">← กลับหน้าหลัก</button>
  ${petStage()===5?`<div class="row" style="margin-top:16px"><button class="btn moon" onclick="go('reveal')">ดูตัวตนของฉัน: ${esc((ANIMALS[(petRank()||['lion'])[0]]||{}).name||'')}</button></div>`:''}
  <h2 class="sum-title">ภาพรวมตัวฉัน</h2><p class="sub">รวบรวมจากคำตอบของคุณตลอดคอร์ส ยิ่งทำมาก ภาพยิ่งชัด</p>
  <dl class="sum">${rows || '<p class="sub">ยังไม่มีคำตอบ ทำบทแรกแล้วกลับมาดูหน้านี้อีกครั้ง</p>'}</dl>
  <div class="row" style="margin-top:32px"><button class="btn ghost" onclick="exportTxt()">ดาวน์โหลดบันทึกทั้งหมด</button></div>`;
}
function exportTxt(){
  let out = 'ใจรู้ — บันทึกการเข้าใจตัวเอง 30 วัน\n\n';
  DAYS.forEach((d,i)=>{ const n=i+1, a=S.ans[n]; if(!a) return;
    out += `วันที่ ${n}: ${d.t}${S.done[n]?` (${S.done[n]})`:''}\n`;
    d.q.forEach(q=>{ const v=a[q.id]; if(v==null) return;
      out += `- ${q.p}\n  ${q.type==='scale'?q.items.map((it,j)=>`${it} ${v[j]}`).join(', '):Array.isArray(v)?v.join(', '):v}\n`; });
    out += '\n'; });
  const b = new Blob([out],{type:'text/plain;charset=utf-8'}), u = URL.createObjectURL(b), l = document.createElement('a');
  l.href=u; l.download='jairu-journal.txt'; l.click(); setTimeout(()=>URL.revokeObjectURL(u),1000);
}

/* ===== เริ่มทำงาน ===== */
function go(name,n){
  if(name==='day' && (!unlocked(n) || needsPro(n))) return;
  view={name,n}; render(); window.scrollTo(0,0);
}
function render(){
  const app = document.getElementById('app');
  app.innerHTML = view.name==='day' ? dayView(view.n) : view.name==='summary' ? summary() : view.name==='reveal' ? revealView() : home();
  if(S && S.grew && view.name==='home'){ delete S.grew; save(); }
}
(async()=>{
  member = await getMember();
  if(member.loggedIn && (member.isPro || DEV) && !member.demo){
    try{ const r = await fetch('/api/jairu/content',{credentials:'same-origin',cache:'no-store'});
      if(r.ok){ const d = await r.json(); d.days.forEach((day,k)=>{ const n=d.from+k; DAYS[n-1] = Object.assign(day,{m:Math.floor((n-1)/5)}); }); }
      else if(member.isPro) member.contentError = true;
    }catch(e){ if(member.isPro) member.contentError = true; }
  }
  if(!member.loggedIn){
    document.getElementById('app').innerHTML = `<div class="gate"><h1 class="title">ใจรู้</h1><p class="tagline">แบบฝึกเข้าใจตัวเองวันละบท 30 วัน ทำฟรี 7 วันแรก</p><p class="sub" style="margin:18px 0 22px">เข้าสู่ระบบสมาชิก ARSTINLA ด้วย LINE เพื่อเริ่มบทแรก</p><div class="row"><a class="btn" href="${LOGIN_URL}?next=${encodeURIComponent(location.pathname)}">เข้าสู่ระบบด้วย LINE</a></div></div>`;
    return;
  }
  S = load() || {start:today(), done:{}, ans:{}, mood:{}};
  render();
})();
</script>
</body>
</html>
