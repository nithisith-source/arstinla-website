<style>

.panel button{height:32px;padding:0 10px;border:1px solid var(--ink);background:#fff;cursor:pointer;font-size:12.5px}.panel button.del{border-color:#b4442c;color:#b4442c}
.sw{width:24px;height:24px;border:1px solid #0003;border-radius:50%;cursor:pointer;padding:0}

.sum{font-size:13px;line-height:1.7}.sum b{font-size:18px}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:8;background:rgba(244,241,234,.92)}.empty[hidden]{display:none}
.empty div{max-width:460px;text-align:center;line-height:1.7;padding:24px;border:1px solid var(--ink);background:#fff}.empty a{display:inline-block;margin-top:10px;padding:9px 16px;background:var(--accent);color:#fff;text-decoration:none}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:9px 16px;font-size:13px;z-index:40;display:none;border-radius:4px}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:4px;z-index:5}.zoom button{width:36px;height:36px;border:1px solid var(--ink);background:#fff;font-size:18px;cursor:pointer}
@media(max-width:820px){.side{top:auto;bottom:0;left:0;right:0;width:auto;height:178px;border-right:0;border-top:1px solid var(--line);padding:10px}.side h2{margin:6px 0}.cat{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}.stage{left:0;bottom:178px}.top a.brand span{display:none}.top button span.t{display:none}.panel{width:200px}}

<script>
'use strict';
const $=id=>document.getElementById(id),T=THREE,KEY="arstinla-interior";
/* ---------- catalogue: name, price, width, depth, colour (furniture models adapted from Dream House) ---------- */
const GOODS={sofa:['โซฟา',18000,2.4,.9,'#ddc8a5'],chair:['เก้าอี้',3200,.7,.75,'#a47547'],table:['โต๊ะกลาง',4500,1.25,.7,'#92623d'],bed:['เตียงคู่',24000,1.8,2.2,'#8a9b80'],single:['เตียงเดี่ยว',12000,1.05,2.05,'#9aa8b5'],
  dining:['โต๊ะอาหาร',12000,1.6,1.3,'#be9667'],kitchen:['เคาน์เตอร์ครัว',16000,2,.65,'#87907b'],wardrobe:['ตู้เสื้อผ้า',14000,1.2,.6,'#c9b79a'],desk:['โต๊ะทำงาน',5500,1.2,.6,'#a88560'],tv:['ตู้ทีวี',7500,1.8,.45,'#6f6a60'],
  shelf:['ชั้นวาง',6500,1.4,.4,'#ae8055'],rug:['พรม',2800,2.5,1.8,'#c9ac8b'],plant:['ต้นไม้',1500,.65,.65,'#668354'],lamp:['โคมไฟ',2200,.45,.45,'#d9bb86'],
  toilet:['สุขภัณฑ์',6500,.45,.7,'#f0f0e8'],sink:['อ่างล้างหน้า',4500,.6,.45,'#f2f1ea'],shower:['ฝักบัว/ยืนอาบ',8500,.9,.9,'#cfdde0'],car:['รถยนต์',0,1.8,4.5,'#8b98a5']};
const SWATCH=['#ddc8a5','#a47547','#8a9b80','#c9b79a','#6f6a60','#f2efe6','#b65f45','#4f6b7d','#d9bb86','#2f312e'];
let H=null,objs=[],active=0,cut=true,picked=null,tool=null,ghost=null,placeRot=0,hist=[],uid=Date.now();
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)}
function save(){try{localStorage.setItem(KEY,JSON.stringify({house:H,objects:objs,active}))}catch(e){toast('บันทึกอัตโนมัติไม่ได้ — กดบันทึกไฟล์แทน')}}
function snapshot(){hist.push(JSON.stringify(objs));if(hist.length>60)hist.shift()}
/* ---------- three.js scene ---------- */
const world=$('world'),renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.setClearColor('#e9e6de');world.appendChild(renderer.domElement);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(40,1,.1,600),house=new T.Group(),furn=new T.Group(),prev=new T.Group();scene.add(house,furn,prev);
scene.add(new T.HemisphereLight('#fffaf0','#a7a08f',2.2));const sun=new T.DirectionalLight('#fff1d8',2.6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;scene.add(sun,sun.target);
const matCache=new Map();function mat(c,o){const k=c+JSON.stringify(o||{});if(!matCache.has(k))matCache.set(k,new T.MeshStandardMaterial(Object.assign({color:c,roughness:.82},o||{})));return matCache.get(k)}
function cube(par,x,y,z,w,h,d,c,cast=true){const m=new T.Mesh(new T.BoxGeometry(w,h,d),typeof c==='string'?mat(c):c);m.position.set(x,y+h/2,z);m.castShadow=cast;m.receiveShadow=true;par.add(m);return m}
function cyl(par,x,y,z,r1,r2,h,c,n=20){const m=new T.Mesh(new T.CylinderGeometry(r1,r2,h,n),mat(c));m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;par.add(m);return m}
function clearGroup(g){g.traverse(o=>{if(o.geometry)o.geometry.dispose()});g.clear()}
const FLOORC={wood:'#c9a57a',tile:'#e2ded3',stone:'#cfc9bb',concrete:'#c9c6bf',marble:'#efece6',grass:'#9fb57f',carpet:'#b9a99a'};
function floorColor(r){if(r.floor&&FLOORC[r.floor])return FLOORC[r.floor];const c=new T.Color(r.color||'#d8cfbf');c.lerp(new T.Color('#f4efe4'),.55);return '#'+c.getHexString()}
function buildHouse(){clearGroup(house);if(!H)return;const top=active;
  const g=new T.Mesh(new T.PlaneGeometry(400,400),mat('#e2dfd6'));g.rotation.x=-Math.PI/2;g.position.y=-.02;g.receiveShadow=true;house.add(g);
  const site=new T.Mesh(new T.PlaneGeometry(H.site.w,H.site.d),mat('#d9d5c9'));site.rotation.x=-Math.PI/2;site.position.set(H.site.w/2,-.01,H.site.d/2);site.receiveShadow=true;house.add(site);
  const flBase=H.floors[top]?H.floors[top].base:0;
  H.boxes.forEach(b=>{if(b.level>top)return;let[x0,y0,z0,x1,y1,z1]=b.b;const isWall=b.kind==='wall'||b.kind==='glass'||b.kind==='frame';
    if(cut&&b.level===top&&isWall){const lim=flBase+1.25;if(z0>=lim)return;z1=Math.min(z1,lim)}
    if(z1-z0<1e-3)return;const c=b.kind==='glass'?mat('#bcd8df',{transparent:true,opacity:.45,roughness:.1}):b.kind==='frame'?mat(b.c||'#4a4d49'):b.kind==='slab'?mat('#dcd7cb'):b.kind==='stair'?mat('#e6dccb'):mat(b.level===top?'#f6f3ec':'#ebe7de');
    const m=cube(house,(x0+x1)/2,z0,(y0+y1)/2,x1-x0,z1-z0,y1-y0,c,b.kind!=='glass');m.userData={kind:'house'}});
  H.faces.forEach(f=>{if(f.level>top)return;if(f.kind==='roof'&&cut&&f.level<=top)return;addFace(f)});
  // room floor finishes (pickable floor for placing furniture)
  H.rooms.forEach(r=>{if(r.level!==top||r.stair)return;const p=new T.Mesh(new T.PlaneGeometry(Math.max(.05,r.w-2*r.wi),Math.max(.05,r.d-2*r.wi)),mat(floorColor(r)));p.rotation.x=-Math.PI/2;p.position.set(r.x+r.w/2,r.zf+.004,r.y+r.d/2);p.receiveShadow=true;p.userData={kind:'floor',room:r.id};house.add(p)});
  const cx=H.site.w/2,cz=H.site.d/2,R=Math.max(H.site.w,H.site.d);sun.position.set(cx-R*.6,R*1.4,cz+R*.8);sun.target.position.set(cx,0,cz);Object.assign(sun.shadow.camera,{left:-R,right:R,top:R,bottom:-R,near:1,far:R*4});sun.shadow.camera.updateProjectionMatrix()}
function addFace(f){const p=f.pts;if(p.length<3)return;const pos=[];for(let i=1;i<p.length-1;i++)[p[0],p[i],p[i+1]].forEach(q=>pos.push(q[0],q[2],q[1]));const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.computeVertexNormals();
  const m=new T.Mesh(g,new T.MeshStandardMaterial({color:f.kind==='roof'?(f.color||'#6e7468'):f.kind==='stair'?'#e6dccb':(f.color||'#cfc6b6'),side:T.DoubleSide,roughness:.85}));m.castShadow=true;m.receiveShadow=true;house.add(m)}
/* ---------- furniture models ---------- */
function model(o,ghostMode){const spec=GOODS[o.type],g=new T.Group(),color=o.color||spec[4],leg='#796348',b=(x,y,z,w,h,d,c)=>cube(g,x,y,z,w,h,d,c),c=(x,y,z,r1,r2,h,col,n)=>cyl(g,x,y,z,r1,r2,h,col,n);
  const legs=(w,d,h)=>{for(const x of [-w/2+.1,w/2-.1])for(const z of [-d/2+.1,d/2-.1])b(x,0,z,.065,h,.065,leg)};
  switch(o.type){case 'sofa':legs(2.2,.8,.15);b(0,.15,0,2.4,.3,.9,color);b(0,.45,-.36,2.4,.5,.18,color);for(const x of [-1.12,1.12])b(x,.4,0,.18,.38,.92,color);for(let i=0;i<3;i++)b((i-1)*.69,.46,.08,.67,.18,.64,'#e6d8bd');break;
    case 'chair':legs(.65,.65,.43);b(0,.43,0,.72,.13,.72,color);b(0,.55,-.3,.72,.5,.1,color);b(0,.57,.02,.55,.1,.48,'#dec9a7');break;
    case 'table':legs(1.15,.6,.35);b(0,.35,0,1.25,.09,.7,color);break;
    case 'bed':b(0,.04,0,1.8,.32,2.2,'#a27b52');b(0,.36,0,1.74,.25,2.12,'#ece6d6');b(0,.08,-1.02,1.9,.95,.14,color);b(0,.61,.38,1.77,.1,1.25,color);for(const x of [-.43,.43])b(x,.63,-.65,.65,.13,.43,'#fcf6e6');break;
    case 'single':b(0,.04,0,1.05,.32,2.05,'#a27b52');b(0,.36,0,1,.24,1.98,'#ece6d6');b(0,.08,-.96,1.1,.85,.12,color);b(0,.6,.35,1.02,.1,1.2,color);b(0,.62,-.62,.6,.13,.4,'#fcf6e6');break;
    case 'dining':legs(1.6,.85,.72);b(0,.72,0,1.6,.09,.85,color);for(const x of [-.5,.5])for(const z of [-.62,.62]){b(x,0,z,.4,.42,.36,'#a58960');b(x,.42,z+(z>0?.15:-.15),.43,.43,.08,'#9aab88')}break;
    case 'kitchen':b(0,0,0,2,.86,.65,color);b(0,.86,0,2.06,.07,.7,'#e5ddc9');b(-.5,.935,0,.6,.015,.43,'#69766b');c(.55,.94,0,.16,.16,.02,'#3a4741');b(0,1.45,-.17,2,.7,.32,color);break;
    case 'wardrobe':b(0,0,0,1.2,2.2,.6,color);b(0,.1,.301,.012,2,.01,'#7a6a52');for(const x of [-.08,.08])b(x,1,.31,.03,.25,.03,'#6e604c');break;
    case 'desk':legs(1.1,.5,.72);b(0,.72,0,1.2,.04,.6,color);b(.35,.3,0,.4,.42,.55,color);c(-.25,.76,-.1,.12,.15,.02,'#3a3d39');b(-.25,.78,-.12,.36,.25,.02,'#2b2d2b');break;
    case 'tv':b(0,0,0,1.8,.45,.45,color);b(0,.45,-.12,1.4,.8,.05,'#1f2120');b(0,.47,-.12,1.36,.76,.06,'#2c3a44');break;
    case 'shelf':b(0,0,0,1.4,1.5,.4,color);for(let i=0;i<3;i++)b(0,.12+i*.45,.215,1.22,.34,.03,'#534d36');break;
    case 'rug':b(0,.003,0,2.5,.02,1.8,color);break;
    case 'plant':c(0,0,0,.23,.16,.4,'#ba9c7a');for(let i=0;i<7;i++){const a=i*2.4,r=i%2?.2:.12,l=new T.Mesh(new T.SphereGeometry(.26,10,8),mat(i%2?'#68894f':'#88a56a'));l.position.set(Math.cos(a)*r,.8+i*.06,Math.sin(a)*r);l.scale.set(.5,1.4,.8);l.castShadow=true;g.add(l)}break;
    case 'lamp':c(0,0,0,.2,.23,.05,'#867d62');c(0,.05,0,.025,.025,1.4,'#8a7d5d');c(0,1.3,0,.18,.33,.42,'#eee3c6');break;
    case 'toilet':b(0,0,-.25,.42,.8,.2,color);c(0,0,.05,.2,.17,.42,color);c(0,.42,.05,.21,.21,.04,'#e2e2d8');break;
    case 'sink':b(0,0,0,.6,.8,.45,'#b8a68c');b(0,.8,0,.62,.08,.47,color);c(0,.86,.03,.18,.14,.03,'#dfe6e6');c(0,.88,-.17,.02,.02,.18,'#a9b0b0',8);break;
    case 'shower':b(0,0,0,.9,.06,.9,'#e8eef0');b(-.44,.06,0,.02,2,.9,mat('#bcd8df',{transparent:true,opacity:.35}));b(0,.06,.44,.9,2,.02,mat('#bcd8df',{transparent:true,opacity:.35}));c(.3,1.9,-.3,.1,.1,.03,'#a9b0b0');break;
    case 'car':b(0,.25,0,1.8,.6,4.5,color);b(0,.85,-.2,1.6,.5,2.3,mat('#9fb3bf',{roughness:.2}));for(const x of [-.8,.8])for(const z of [-1.45,1.45]){const w=c(x,.0,z,.33,.33,.22,'#2a2b29',16);w.rotation.z=Math.PI/2;w.position.y=.33}break}
  g.traverse(m=>{if(m.isMesh){m.userData={kind:'obj',id:o.id};if(ghostMode){m.material=m.material.clone();m.material.transparent=true;m.material.opacity=.55;m.castShadow=false}}});return g}
function roomAt(x,y,L){return H.rooms.find(r=>r.level===L&&!r.stair&&x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.d)}
function dims(o){const s=GOODS[o.type],q=Math.abs(Math.sin(o.rot||0))>.7;return q?[s[3],s[2]]:[s[2],s[3]]}
function placeObj(g,o){const r=roomAt(o.x,o.y,o.level),z=r?r.zf:(H.floors[o.level]||{base:0}).base;g.position.set(o.x,z,o.y);g.rotation.y=-(o.rot||0)}
function buildFurniture(){clearGroup(furn);objs.forEach(o=>{if(o.level!==active)return;const g=model(o);placeObj(g,o);furn.add(g);if(o.id===picked){const box=new T.BoxHelper(g,'#c47a55');box.userData={kind:'helper'};furn.add(box)}})}
/* wall snap: push furniture against the inner face of the room walls when close */
function wallSnap(o){const r=roomAt(o.x,o.y,o.level);if(!r)return o;const[w,d]=dims(o),i=r.wi,tol=.25,x0=r.x+i,x1=r.x+r.w-i,y0=r.y+i,y1=r.y+r.d-i;
  if(o.x-w/2-x0<tol)o.x=x0+w/2;if(x1-(o.x+w/2)<tol)o.x=x1-w/2;if(o.y-d/2-y0<tol)o.y=y0+d/2;if(y1-(o.y+d/2)<tol)o.y=y1-d/2;return o}
/* ---------- camera ---------- */
let theta=.75,phi=.95,dist=30,target=new T.Vector3();
function fit(){if(!H)return;const xs=H.rooms.map(r=>[r.x,r.x+r.w]).flat(),ys=H.rooms.map(r=>[r.y,r.y+r.d]).flat(),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  target.set((x0+x1)/2,(H.floors[active]||{base:0}).base,(y0+y1)/2);dist=Math.max(12,Math.hypot(x1-x0,y1-y0)*1.35);theta=.75;phi=.95;cam()}
function cam(){const d=dist*Math.max(1,1.2/camera.aspect);camera.position.set(target.x+d*Math.sin(phi)*Math.sin(theta),target.y+d*Math.cos(phi),target.z+d*Math.sin(phi)*Math.cos(theta));camera.lookAt(target);render()}
function render(){renderer.render(scene,camera);labels()}
function resize(){const w=world.clientWidth,h=world.clientHeight;if(!w||!h)return;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();cam()}new ResizeObserver(resize).observe(world);
function labels(){const el=$('labels');if(!H){el.innerHTML='';return}const w=world.clientWidth,h=world.clientHeight;
  el.innerHTML=H.rooms.filter(r=>r.level===active).map(r=>{const v=new T.Vector3(r.x+r.w/2,r.zf+.05,r.y+r.d/2).project(camera);if(v.z>1)return'';return`<span style="left:${(v.x+1)/2*w}px;top:${(1-v.y)/2*h}px">${esc(r.name)}<small>${(r.w*r.d).toFixed(1)} ม²</small></span>`}).join('')}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- picking / interaction ---------- */
const ray=new T.Raycaster(),ptr=new T.Vector2();
function cast(e){const r=renderer.domElement.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ptr,camera)}
function floorPoint(e){cast(e);const hits=ray.intersectObjects(house.children.filter(m=>m.userData.kind==='floor'),false);if(hits[0])return{x:hits[0].point.x,y:hits[0].point.z,room:hits[0].object.userData.room};
  const pl=new T.Plane(new T.Vector3(0,1,0),-((H.floors[active]||{base:0}).base)),p=ray.ray.intersectPlane(pl,new T.Vector3());return p?{x:p.x,y:p.z,room:null}:null}
function objAt(e){cast(e);const h=ray.intersectObjects(furn.children,true).find(i=>i.object.userData.kind==='obj');return h?objs.find(o=>o.id===h.object.userData.id):null}
const snap=v=>Math.round(v*20)/20;let drag=null,orbit=null,pan=null,pts=new Map(),pinch=null;const cv=renderer.domElement;cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{if(!H)return;cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){drag=null;orbit=null;const a=[...pts.values()];pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};return}
  if(e.button===2||e.button===1||e.shiftKey){pan={x:e.clientX,y:e.clientY};return}
  if(tool){const p=floorPoint(e);if(!p)return;const o=wallSnap({id:'o'+(uid++),type:tool,x:snap(p.x),y:snap(p.y),rot:placeRot,level:active});if(!roomAt(o.x,o.y,active)){toast('วางบนพื้นห้องของชั้นนี้');return}snapshot();objs.push(o);picked=o.id;save();buildFurniture();updatePanel();summary();render();toast('วาง'+GOODS[o.type][0]+'แล้ว · คลิกวางต่อได้ · Esc เลิก');return}
  const o=objAt(e);if(o){const p=floorPoint(e);picked=o.id;drag={o,dx:p?o.x-p.x:0,dy:p?o.y-p.y:0,moved:false,start:JSON.stringify(objs)};buildFurniture();updatePanel();render();return}
  orbit={x:e.clientX,y:e.clientY,moved:false}});
cv.addEventListener('pointermove',e=>{if(pts.has(e.pointerId))pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pts.size>=2){const a=[...pts.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),x=(a[0].x+a[1].x)/2,y=(a[0].y+a[1].y)/2;dist=Math.max(3,Math.min(200,dist*pinch.d/Math.max(1,d)));panBy(x-pinch.x,y-pinch.y);pinch={d,x,y};cam();return}
  if(pan){panBy(e.clientX-pan.x,e.clientY-pan.y);pan={x:e.clientX,y:e.clientY};cam();return}
  if(orbit){const dx=e.clientX-orbit.x,dy=e.clientY-orbit.y;if(Math.abs(dx)+Math.abs(dy)>2)orbit.moved=true;theta-=dx*.008;phi=Math.max(.05,Math.min(1.45,phi-dy*.008));orbit.x=e.clientX;orbit.y=e.clientY;cam();return}
  if(drag){const p=floorPoint(e);if(!p)return;const nx=snap(p.x+drag.dx),ny=snap(p.y+drag.dy);if(!roomAt(nx,ny,active))return;drag.o.x=nx;drag.o.y=ny;wallSnap(drag.o);drag.moved=true;buildFurniture();render();return}
  if(tool){const p=floorPoint(e);clearGroup(prev);if(!p){render();return}const o=wallSnap({id:'ghost',type:tool,x:snap(p.x),y:snap(p.y),rot:placeRot,level:active}),g=model(o,true);placeObj(g,o);if(!roomAt(o.x,o.y,active))g.traverse(m=>{if(m.isMesh)m.material.color.set('#d97b66')});prev.add(g);render()}});
function panBy(dx,dy){const k=dist*Math.max(1,1.2/camera.aspect)*.0016,right=new T.Vector3(Math.cos(theta),0,-Math.sin(theta)),fwd=new T.Vector3(-Math.sin(theta),0,-Math.cos(theta));target.addScaledVector(right,-dx*k).addScaledVector(fwd,dy*k)}
const end=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(drag){if(drag.moved){hist.push(drag.start);save();summary()}drag=null}
  if(orbit&&!orbit.moved&&!tool){picked=null;buildFurniture();updatePanel();render()}orbit=null;pan=null};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('pointerleave',()=>{if(tool){clearGroup(prev);render()}});
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(3,Math.min(200,dist*Math.exp(e.deltaY*.0012)));cam()},{passive:false});
document.querySelectorAll('.zoom button').forEach(b=>b.onclick=()=>{const z=b.dataset.z;if(z==='fit')fit();else{dist=Math.max(3,Math.min(200,dist*(z==='in'?.8:1.25)));cam()}});
/* ---------- UI ---------- */
function setTool(t){tool=t;placeRot=0;clearGroup(prev);document.querySelectorAll('#cat button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('hint').textContent=t?`วาง${GOODS[t][0]}: คลิกบนพื้นห้อง · R หมุน · ชิดผนังอัตโนมัติ · Esc เลิก`:'ลากพื้นที่ว่างเพื่อหมุนมุมมอง · คลิกขวา/2 นิ้วลากเพื่อเลื่อน · ล้อเมาส์ซูม · คลิกของเพื่อเลือก/ลากย้าย';render()}
$('cat').innerHTML=Object.entries(GOODS).map(([k,[n,p,w,d,c]])=>`<button type="button" data-t="${k}"><b><i style="background:${c}"></i>${n}</b><small>${w.toFixed(2)}×${d.toFixed(2)} ม.${p?' · '+p.toLocaleString('th-TH')+' ฿':''}</small></button>`).join('');
$('cat').onclick=e=>{const b=e.target.closest('[data-t]');if(b)setTool(tool===b.dataset.t?null:b.dataset.t)};
function renderBar(){if(!H){$('bar').innerHTML='';return}$('bar').innerHTML=H.floors.map((f,i)=>`<button type="button" data-l="${i}" class="${i===active?'on':''}">ชั้น ${i+1}</button>`).join('')+'<span class="gap"></span>'+
  `<button type="button" data-v="cut" class="${cut?'on':''}">ตัดผนัง</button><button type="button" data-v="full" class="${cut?'':'on'}">ทั้งหลัง</button><button type="button" data-v="top">มุมบน</button>`}
$('bar').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.l!=null){active=+b.dataset.l;picked=null;setTool(null);rebuild();fit();save()}else if(b.dataset.v==='top'){phi=.05;cam()}else{cut=b.dataset.v==='cut';rebuild()}};
function updatePanel(){const o=objs.find(x=>x.id===picked),P=$('panel');if(!o){P.hidden=true;return}P.hidden=false;const[w,d]=dims(o),r=roomAt(o.x,o.y,o.level);
  P.innerHTML=`<h3>${GOODS[o.type][0]}</h3><div>${w.toFixed(2)} × ${d.toFixed(2)} ม.${r?' · '+esc(r.name):''}</div><div class="row">${SWATCH.map(c=>`<button class="sw" data-c="${c}" style="background:${c}" title="${c}"></button>`).join('')}</div><div class="row"><button type="button" data-a="rot">↻ หมุน 90°</button><button type="button" data-a="rot15">↻ 15°</button><button type="button" data-a="dup">⧉ ทำซ้ำ</button><button type="button" class="del" data-a="del">ลบ</button></div>`}
$('panel').onclick=e=>{const o=objs.find(x=>x.id===picked);if(!o)return;const c=e.target.closest('[data-c]'),a=e.target.closest('[data-a]');snapshot();
  if(c)o.color=c.dataset.c;else if(a){const v=a.dataset.a;if(v==='rot'){o.rot=(o.rot||0)+Math.PI/2;wallSnap(o)}else if(v==='rot15')o.rot=(o.rot||0)+Math.PI/12;else if(v==='dup'){const n={...o,id:'o'+(uid++),x:snap(o.x+.4),y:snap(o.y+.4)};objs.push(n);picked=n.id}else if(v==='del'){objs=objs.filter(x=>x!==o);picked=null}}else{hist.pop();return}
  save();buildFurniture();updatePanel();summary();render()};
function summary(){if(!H){$('sum').innerHTML='';return}const L=objs.filter(o=>o.level===active),cost=objs.reduce((s,o)=>s+GOODS[o.type][1],0),area=H.rooms.filter(r=>!r.stair).reduce((s,r)=>s+r.w*r.d,0);
  $('sum').innerHTML=`<div>${esc(H.name)}</div><div>พื้นที่ห้องรวม <b>${area.toFixed(1)}</b> ม²</div><div>เฟอร์นิเจอร์ชั้นนี้ ${L.length} ชิ้น · ทั้งหลัง ${objs.length} ชิ้น</div><div>งบเฟอร์นิเจอร์ ≈ <b>${cost.toLocaleString('th-TH')}</b> ฿</div>`}
function rebuild(){buildHouse();buildFurniture();renderBar();updatePanel();summary();render()}
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
  if(e.key==='Escape'){setTool(null);picked=null;buildFurniture();updatePanel();render()}
  if(e.key.toLowerCase()==='r'){if(tool){placeRot+=Math.PI/2;toast('หมุนก่อนวาง 90°')}else{const o=objs.find(x=>x.id===picked);if(o){snapshot();o.rot=(o.rot||0)+Math.PI/2;wallSnap(o);save();buildFurniture();updatePanel();render()}}}
  if((e.key==='Delete'||e.key==='Backspace')&&picked){e.preventDefault();snapshot();objs=objs.filter(x=>x.id!==picked);picked=null;save();buildFurniture();updatePanel();summary();render()}});
function undo(){if(!hist.length)return;objs=JSON.parse(hist.pop());picked=null;save();buildFurniture();updatePanel();summary();render()}$('undoBtn').onclick=undo;
$('pngBtn').onclick=()=>{clearGroup(prev);const keep=picked;picked=null;buildFurniture();render();const a=document.createElement('a');a.href=renderer.domElement.toDataURL('image/png');a.download=(H?H.name:'interior')+' interior.png';a.click();picked=keep;buildFurniture();render()};
$('saveBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({house:H,objects:objs},null,1)],{type:'application/json'}));a.download=(H?H.name:'interior')+'.interior.json';a.click();toast('บันทึกไฟล์แล้ว · เปิดกลับได้ด้วยปุ่ม 📂')};
$('openBtn').onclick=()=>$('fileIn').click();$('fileIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const s=JSON.parse(await f.text());if(!s.house||!Array.isArray(s.house.rooms))throw 0;H=s.house;objs=(s.objects||[]).filter(o=>GOODS[o.type]);active=0;hist=[];save();$('empty').hidden=true;rebuild();fit();toast('เปิดไฟล์แล้ว')}catch(_){toast('ไฟล์ไม่ถูกต้อง')}e.target.value=''};
/* ---------- load ---------- */
(function init(){let st=null;try{st=JSON.parse(localStorage.getItem(KEY))}catch(_){}
  if(st&&st.house){H=st.house;objs=(st.objects||[]).filter(o=>GOODS[o.type]);active=Math.min(st.active|0,H.floors.length-1)}
  if(new URLSearchParams(location.search).get('from')==='massing'){try{const imp=JSON.parse(localStorage.getItem('arstinla-interior-import'));if(imp&&imp.rooms){const sameHouse=H&&H.name===imp.name;H=imp;if(!sameHouse&&objs.length&&!confirm('นำบ้านใหม่ "'+imp.name+'" เข้ามา — เก็บเฟอร์นิเจอร์เดิมไว้ด้วยไหม?'))objs=[];objs=objs.filter(o=>o.level<H.floors.length);active=Math.min(active,H.floors.length-1);save();toast('นำบ้านจาก Massing Studio เข้ามาแล้ว — เลือกเฟอร์นิเจอร์ทางซ้ายแล้วคลิกวางบนพื้น')}}catch(_){}history.replaceState(null,'',location.pathname)}
  $('empty').hidden=!!H;resize();rebuild();fit();setTool(null)})();
</script>
